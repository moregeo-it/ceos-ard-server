openapi: 3.1.0
info:
  title: CEOS ARD Editor API
  version: 0.1.0
  description: |
    RESTful API for the CEOS ARD Editor application that provides workspace management,
    file editing, building block management, and GitHub integration capabilities.
  contact:
    name: CEOS ARD Team
    url: https://github.com/ceos-org/ceos-ard-editor
  license:
    name: Apache-2.0
    url: https://github.com/ceos-org/ceos-ard-editor/blob/main/LICENSE

servers:
  - url: http://localhost:8000
    description: Development server
  - url: https://ceos-ard-editor.example.com/api
    description: Production server

security:
  - cookieAuth: []
  - bearerAuth: []


tags:
  - name: Authentication
    description: User authentication and session management
  - name: Workspaces
    description: Workspace CRUD operations and management
  - name: Realtime
    description: Real-time workspace change notifications delivered over a WebSocket connection
  - name: Files
    description: File and building block operations
  - name: Previews
    description: Preview generation and management
  - name: PFS
    description: Product Family Specification management
  - name: Sharing
    description: Workspace sharing, collaborator management, and invitations

paths:
  /pfs:
    get:
      summary: List available PFS types
      description: Retrieves all available PFS types for CEOS-ARD (as available on the main branch of the ceos-ard repository)
      operationId: listPFSTypes
      tags:
        - PFS
      responses:
        '200':
          description: Available PFS types
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/pfsTypes'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/login:
    get:
      summary: Initiate login
      description: Redirects to the identity provider for authentication
      operationId: initiateLogin
      tags:
        - Authentication
      security: []
      parameters:
        - name: identity_provider
          in: query
          required: false
          schema:
            type: string
            enum:
              - github
              - google
            default: github
        - name: prompt
          in: query
          required: false
          description: |
            `select_account` makes GitHub show its account picker instead of reusing the browser's
            GitHub session; the editor sends it when a tab has to switch back to its own account.
          schema:
            type: string
            enum:
              - select_account
      responses:
        '302':
          description: Redirect to the provider's authorization page
          headers:
            Location:
              description: Provider authorization URL
              schema:
                type: string
                format: uri
        '422':
          description: Unknown identity provider
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/callback/{provider}:
    get:
      summary: OAuth callback
      description: |
        Completes the login started at `/auth/login`: stores the provider tokens server-side, sets
        the session cookie (the JWT, `HttpOnly; Secure; SameSite=Strict; Path=/`, for the JWT's
        lifetime) and redirects to the editor's `/auth/callback` without any parameters. The editor
        then reads the user and the session expiry from `GET /auth/user`.

        GitHub is asked for an expiring token (`offline_access` scope): an 8-hour access token with
        a refresh token, which the server uses to renew the session. A GitHub token issued without
        an expiry cannot be renewed; that session ends after 8 hours.

        The editor and the API must be on the same site (same registrable domain, e.g.
        `editor.example.org` and `api.example.org`), otherwise the cookie is third-party and
        browsers may block it.
      operationId: authCallback
      tags:
        - Authentication
      security: []
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum:
              - github
              - google
        - name: code
          in: query
          required: true
          description: Authorization code from the provider
          schema:
            type: string
        - name: state
          in: query
          required: true
          description: OAuth state, checked against the login request
          schema:
            type: string
      responses:
        '302':
          description: Logged in; redirects to the editor. On failure, redirects to the editor's `/auth/error` with `message` and `provider` parameters.
          headers:
            Location:
              schema:
                type: string
                format: uri
            Set-Cookie:
              description: The session cookie (`__Host-session`)
              schema:
                type: string

  /auth/logout:
    post:
      summary: Logout user
      description: |
        Revokes the provider token (best effort), clears the stored provider tokens and the session
        cookie, and closes the user's realtime sockets with `4001`. The JWT itself can't be
        invalidated, but it is refused afterwards because the provider token is gone.
      operationId: logout
      tags:
        - Authentication
      parameters:
        - $ref: '#/components/parameters/ClientId'
      responses:
        '200':
          description: Logged out
          headers:
            Set-Cookie:
              description: Expires the session cookie
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - message
                properties:
                  status:
                    type: string
                    enum:
                      - success
                  message:
                    type: string
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/user:
    get:
      summary: Get current user information
      description: The authenticated user and when the session ends. Browsers can't read the HttpOnly cookie, so `expires_at` is how the editor knows when to ask for a new login. Renews an expired provider token first, like every authenticated request.
      operationId: getCurrentUser
      tags:
        - Authentication
      responses:
        '200':
          description: User information retrieved successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                  - username
                  - identity_provider
                  - expires_at
                properties:
                  id:
                    type: string
                  email:
                    type: string
                    format: email
                  username:
                    type: string
                  full_name:
                    type: string
                  created_at:
                    type: string
                    format: date-time
                  updated_at:
                    type: string
                    format: date-time
                  identity_provider:
                    type: string
                    enum:
                      - github
                      - google
                  expires_at:
                    type: string
                    format: date-time
                    description: When the JWT, and with it the session cookie, expires
        '401':
          description: The JWT is invalid, or the provider token expired and could not be renewed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/validate:
    post:
      summary: Validate the session and renew it if needed
      description: |
        Validates the JWT, renewing an expired provider token transparently (Google, and GitHub
        with expiring tokens), and renews the JWT within 15 minutes of expiry. A cookie session is
        renewed with a fresh cookie; the JWT is returned in the body (`access_token`) only to
        callers that sent it as a bearer header.
      operationId: validateSession
      tags:
        - Authentication
      parameters:
        - $ref: '#/components/parameters/ClientId'
      responses:
        '200':
          description: The session is valid
          content:
            application/json:
              schema:
                type: object
                required:
                  - valid
                  - expires_at
                  - token_refreshed
                properties:
                  valid:
                    type: boolean
                  user_id:
                    type: string
                  email:
                    type: string
                    format: email
                  username:
                    type: string
                  provider:
                    type: string
                    enum:
                      - github
                      - google
                  updated_at:
                    type: string
                    format: date-time
                  expires_in:
                    type: integer
                  expires_at:
                    type: string
                    format: date-time
                  token_refreshed:
                    type: boolean
                  token_type:
                    type: string
                    enum:
                      - Bearer
                    description: Bearer callers only
                  access_token:
                    type: string
                    description: Bearer callers only; the current JWT, or a fresh one when `token_refreshed` is true
        '401':
          description: The JWT expired, or the provider token expired and could not be renewed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /workspaces:
    get:
      summary: List all workspaces
      description: |
        Retrieves all workspaces the authenticated user has access to - both
        workspaces they own and workspaces they collaborate on ("Shared with
        me"). Each workspace's `viewer_role` field indicates whether the
        caller owns it ("owner") or the mode of their collaboration ("readonly"),
        while `user_id`, `owner_username`, and `owner_full_name` identify the
        workspace owner.
      operationId: listWorkspaces
      tags:
        - Workspaces
      responses:
        '200':
          description: List of workspaces
          content:
            application/json:
              schema:
                type: object
                properties:
                  workspaces:
                    type: array
                    items:
                      $ref: '#/components/schemas/Workspace'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      summary: Create new workspace
      description: Creates a new workspace with cloned repository
      operationId: createWorkspace
      tags:
        - Workspaces
      parameters:
        - $ref: '#/components/parameters/ClientId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
              properties:
                title:
                  type: string
                  description: Workspace title
                  minLength: 1
                  maxLength: 100
                description:
                  type: string
                  description: Workspace description
                pfs:
                  $ref: '#/components/schemas/pfs'
      responses:
        '201':
          description: Workspace created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
        '400':
          description: Invalid request data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /workspaces/{workspaceId}:
    get:
      summary: Get workspace details
      description: Retrieves detailed information about a specific workspace
      operationId: getWorkspace
      tags:
        - Workspaces
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/ClientId'
      responses:
        '200':
          description: Workspace details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
        '403':
          description: Forbidden - missing `X-Client-Id` (this request refreshes the pull request state)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Workspace not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    patch:
      summary: Update workspace
      description: |
        Updates workspace information including title, description, PFS, and status.

        The PFS list doubles as the owner's preview selection: the editor saves it here whenever
        the owner changes the preview, and viewers follow it. Realtime subscribers get a
        `workspace.updated` event naming the changed fields (`workspace.archived` on archiving).

        **Archiving behavior:**
        - Setting status to "archived" will set archived_at to current time and deletion_at to 1 month later
        - Workspace files remain on disk during the 1-month retention period
        - Archived workspaces are automatically deleted after deletion_at date

        **Reactivation behavior:**
        - Setting status to "active" on an archived workspace will clear archived_at and deletion_at
        - Reactivation is only allowed if the pull request status is not "merged" or "closed"
        - Returns 400 error if attempting to reactivate a workspace with merged/closed PR
      operationId: updateWorkspace
      tags:
        - Workspaces
      parameters:
        - $ref: '#/components/parameters/ClientId'
        - $ref: '#/components/parameters/WorkspaceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  description: Workspace title
                description:
                  type: string
                  description: Workspace description
                pfs:
                  $ref: '#/components/schemas/pfs'
                status:
                  type: string
                  enum:
                    - active
                    - archived
                  description: |
                    Workspace status.

                    - Set to "archived" to archive the workspace (sets archived_at and deletion_at)
                    - Set to "active" to reactivate an archived workspace (clears archived_at and deletion_at)
                    - Reactivation only allowed if PR status is not "merged" or "closed"
      responses:
        '200':
          description: Workspace updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
        '400':
          description: |
            Invalid request data or business rule violation.

            Possible errors:
            - Cannot reactivate workspace with merged or closed pull request
            - At least one of description, title, or status must be provided
            - Invalid workspace status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                cannotReactivate:
                  summary: Cannot reactivate merged/closed workspace
                  value:
                    detail: Cannot reactivate an archived workspace with a merged or closed pull request
        '404':
          description: Workspace not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      summary: Delete workspace permanently
      description: |
        Permanently deletes a workspace immediately.

        **Warning:** This action is irreversible.
        - Workspace files are immediately deleted from disk
        - Database record is immediately deleted
        - No recovery possible

        **Note:** To archive a workspace with a 1-month grace period, use PATCH with status="archived" instead.
      operationId: deleteWorkspace
      tags:
        - Workspaces
      parameters:
        - $ref: '#/components/parameters/ClientId'
        - $ref: '#/components/parameters/WorkspaceId'
      responses:
        '204':
          description: Workspace deleted successfully
        '404':
          description: Workspace not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden - user not authorized to delete this workspace
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /workspaces/{workspaceId}/events:
    get:
      summary: Real-time workspace events (WebSocket)
      description: |
        WebSocket stream of workspace changes for any user with access. (Documented under `get`
        because OpenAPI has no WebSocket type - the request is a protocol upgrade.)

        The server pushes `WorkspaceEvent` messages plus a `{"type":"ping"}` heartbeat. Clients send
        nothing: any inbound data frame closes the connection with `1008`, and frames above the
        server's `--ws-max-size` are rejected with `1009`.

        Handshake, in order: the `Origin` header, when present, must be one of the configured CORS
        origins (otherwise the upgrade fails; a browser then sees close code `1006`, no server
        code; this check is also what keeps other same-site hosts from using the session cookie); the
        JWT from the session cookie, which browsers send on the handshake, or an `Authorization:
        Bearer` header is validated; the connection is subscribed to the workspace's events; then workspace access is checked and the connection
        accepted. Subscribing before the access check means a revocation that commits in between is
        still delivered as a terminal event.

        Failures are reported as close codes right after the upgrade, since a close before the
        upgrade is not distinguishable in browsers:

        | Code | Meaning | Editor reaction |
        |---|---|---|
        | `4001` | JWT missing, invalid or expired; also sent when it expires mid-connection or the user logs out | ask for a new login, then reconnect |
        | `4003` | no access to the workspace, or access ended (`collaborator.revoked` for this user, `workspace.deleted`) | stop |
        | `4009` | the server's buffer for this connection overflowed and events were dropped | reconnect at once and resync |
        | `1008` | the client sent data | stop |

        Echo filtering: an event is withheld from the socket whose user *and* `client_id` match the
        client that caused it (that client applied the change locally, see the `X-Client-Id`
        parameter). Other tabs and devices of the same user receive it.

        Planned: the same connection will also carry CRDT document-sync and presence frames for live
        collaborative editing (not yet implemented).
      operationId: subscribeWorkspaceEvents
      tags:
        - Realtime
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - name: client_id
          in: query
          required: false
          description: The id this page load also sends as `X-Client-Id` on requests that change data; used for echo filtering only.
          schema:
            type: string
            pattern: '^[A-Za-z0-9_-]{8,64}$'
      responses:
        '101':
          description: Handshake succeeded; the server streams `WorkspaceEvent` messages until the client disconnects or the server closes with one of the codes above.

  /workspaces/{workspaceId}/files:
    get:
      summary: List files in workspace
      description: |-
        Retrieves files and folders in the workspace.

        Doesn't list the following files / folders:
        - Files/folders starting with a dot (.)

        Additionalls, doesn't list the following Files/folders at the root:
        - templates
        - build
      operationId: listFiles
      tags:
        - Files
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - name: path
          in: query
          description: Directory path to list (defaults to root)
          schema:
            type: string
            default: "/"
        - name: recurse
          in: query
          description: Whether to list files recursively
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: List of files and folders
          content:
            application/json:
              schema:
                type: object
                properties:
                  files:
                    type: array
                    items:
                      $ref: '#/components/schemas/FileItem'
        '404':
          description: Workspace not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      summary: Create new empty file or folder
      description: Creates a new empty file or folder in the workspace
      operationId: createFileOrFolder
      tags:
        - Files
      parameters:
        - $ref: '#/components/parameters/ClientId'
        - $ref: '#/components/parameters/WorkspaceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: File or folder name
                  minLength: 1
                path:
                  type: string
                  description: Directory path where to create the file/folder
                type:
                  type: string
                  enum:
                    - file
                    - folder
                  description: Type of item to create
              required:
                - name
                - path
                - type
      responses:
        '201':
          description: File created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileItem'
        '400':
          description: Invalid request data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Workspace not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden - readonly collaborators cannot create files or folders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /workspaces/{workspaceId}/files/{filePath}:
    get:
      summary: Get file content
      description: |-
        Retrieves the content of a specific file.

        The endoint shall only return files that are made available through
        `GET /workspaces/{workspaceId}/files`. Other files, e.g. withing `.git`
        should not be accessible and return a 404 error.
      operationId: getFileContent
      tags:
        - Files
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/FilePath'
      responses:
        '200':
          description: File content
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '404':
          description: File not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    put:
      summary: Upload file content
      description: |-
        Uploads the content of a specific file.

        Validation may take place, e.g. validating against the strictyaml schemas of the corresponding YAML files.
        File should be stored as is without parsing, e.g. comments in YAML files should be preserved.

        The endoint shall only handle files that are made available through
        `GET /workspaces/{workspaceId}/files`. Other files, e.g. withing `.git`
        should not be changed and return a 404 error.
      operationId: uploadFileContent
      tags:
        - Files
      parameters:
        - $ref: '#/components/parameters/ClientId'
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/FilePath'
      requestBody:
        required: true
        content:
          '*/*':
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: File updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileItem'
        '400':
          description: Invalid request data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: File not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden - readonly collaborators cannot upload file content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      summary: Delete file
      description: |-
        Deletes a specific file.

        The endoint shall only handle files that are made available through
        `GET /workspaces/{workspaceId}/files`. Other files, e.g. withing `.git`
        should not be deleted and return a 404 error.
      operationId: deleteFile
      tags:
        - Files
      parameters:
        - $ref: '#/components/parameters/ClientId'
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/FilePath'
      responses:
        '200':
          description: |-
            A tracked file has been deleted, it could be reverted.
            The file information is returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileItem'
        '204':
          description: |-
            An untracked file has been deleted permanently, it can't be restored.
            No file information is returned.
        '404':
          description: File not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden - readonly collaborators cannot delete files or folders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    patch:
      summary: Update file metadata or operations
      description: |-
        Performs file operations such as rename or revert.

        The endoint shall only handle files that are made available through
        `GET /workspaces/{workspaceId}/files`. Other files, e.g. withing `.git`
        should not be changed and return a 404 error.
      operationId: patchFile
      tags:
        - Files
      parameters:
        - $ref: '#/components/parameters/ClientId'
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/FilePath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                operation:
                  type: string
                  enum:
                    - rename
                    - revert
                  description: The operation to perform on the file
              required:
                - operation
              oneOf:
                - properties:
                    operation:
                      const: rename
                    target:
                      description: New name for the file
                      type: string
                  required:
                    - target
                - properties:
                    operation:
                      const: revert
      responses:
        '200':
          description: |-
            File operation completed successfully.
            The updated file information is returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileItem'
        '400':
          description: Invalid request data or operation conflicts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: File not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden - readonly collaborators cannot rename or revert files
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /workspaces/{workspaceId}/search:
    get:
      summary: Search files in workspace
      description: Searches through all files in the workspace
      operationId: searchFiles
      tags:
        - Workspaces
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - name: query
          in: query
          required: true
          description: Search query
          schema:
            type: string
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      required:
                        - name
                        - path
                        - type
                      properties:
                        name:
                          type: string
                          description: Name to the file containing the match
                        path:
                          type: string
                          description: Absolute path to the file starting from the workspace root
                        type:
                          type: string
                          description: Where the match was found
                          enum:
                            - filename
                            - content
                      oneOf:
                        - type: object
                          properties:
                            type:
                              const: filename
                        - type: object
                          required:
                            - line
                            - column
                            - excerpt
                          properties:
                            type:
                              const: content
                            line:
                              type: integer
                              description: Line number of the match
                            column:
                              type: integer
                              description: Column number of the match
                            excerpt:
                              type: string
                              description: Text excerpt around the match
        '400':
          description: Invalid search query
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Workspace not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /workspaces/{workspaceId}/diffs:
    get:
      summary: Get list of changed files
      description: |
        Retrieves a list of files that are not unchanged (including added, deleted, modified, etc.) according to git.

        Surfaced exclusively in the Propose view - owner only, even for collaborators with "edit" access.
      operationId: getChangedFiles
      tags:
        - Files
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      responses:
        '200':
          description: List of changed files
          content:
            application/json:
              schema:
                type: object
                required:
                  - files
                properties:
                  files:
                    type: array
                    items:
                      $ref: '#/components/schemas/CommitChange'
        '404':
          description: Workspace not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden - only the workspace owner can view the changed-files list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    put:
      summary: Create a commit of the changes
      description: |
        Creates a new git commit for all current workspace changes and pushes it to GitHub.

        Owner only, even for collaborators with "edit" access - only the
        owner's GitHub credentials can push to the workspace's fork.
        Collaborators' staged changes are committed and pushed by the owner.

        When the branch on GitHub moved ahead, the remote changes are merged into the workspace
        automatically; if they conflict with the committed changes, a 409 with the conflicting
        files is returned instead and the changes remain staged. A merge also publishes a
        `workspace.synced` event after the `file.committed` event.
      operationId: commitChanges
      tags:
        - Files
        - Workspaces
      parameters:
        - $ref: '#/components/parameters/ClientId'
        - $ref: '#/components/parameters/WorkspaceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Create a git commit
              required:
                - message
              properties:
                message:
                  $ref: '#/components/schemas/CommitMessage'
      responses:
        '200':
          description: Commit created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommitResult'
        '400':
          description: Invalid request data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Workspace not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden - only the workspace owner can commit changes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Remote changes conflict with the committed changes; changes remain staged
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: object
                    properties:
                      message:
                        type: string
                        description: Human-readable conflict description
                      conflicting_files:
                        type: array
                        items:
                          type: string
                        description: Paths of the conflicting files

  /workspaces/{workspaceId}/diffs/{filePath}:
    get:
      summary: Get diff for specific file
      description: |-
        Retrieves the git diff for a specific file, if available.

        The endoint shall only return files that are made available through
        `GET /workspaces/{workspaceId}/files`. Other files, e.g. withing `.git`
        should not be accessible and return a 404 error.
      operationId: getFileDiff
      tags:
        - Files
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/FilePath'
      responses:
        '200':
          description: File diff information
          content:
            text/plain:
              schema:
                type: string
                description: |-
                  Diff content in unified diff format.
                  Might be empty if there are no changes.
                example: |-
                  diff --git a/glossary/ups.yaml b/glossary/ups.yaml
                  index fafae97..e231b87 100644
                  --- a/glossary/ups.yaml
                  +++ b/glossary/ups.yaml
                  @@ -1,2 +1,2 @@
                  term: UPS
                  -description: Universal Polar Stereographic
                  \ No newline at end of file
                  +description: United Parcel Service
                  \ No newline at end of file
        '404':
          description: Workspace or file not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /workspaces/{workspaceId}/context/{filePath}:
    get:
      summary: Get additional contextual information for specific file
      description: |-
        Retrieves the context for a specific file, if available.

        This is currently a list of PFS that use the specified file.

        The endoint shall only return files that are made available through
        `GET /workspaces/{workspaceId}/files`. Other files, e.g. withing `.git`
        should not be accessible and return a 404 error.
      operationId: getFileContext
      tags:
        - Files
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/FilePath'
      responses:
        '200':
          description: Contextual information retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/FileItem'
                  - type: object
                    required:
                      - usage
                    properties:
                      usage:
                        description: |-
                          List of PFS IDs that use the specified file.

                          Returns an empty array if the file is not used by any PFS.
                          Returns `null` if the information is not available / unknown.
                        type:
                          - array
                          - 'null'
                        items:
                          type: string
                          description: PFS ID that uses the specified file
        '404':
          description: Workspace or file not found, or no diff available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /workspaces/{workspaceId}/previews:
    post:
      summary: Generate preview
      description: |
        Generates the preview for the current workspace state and publishes a
        `preview.generated` event.

        Owner only: a build writes into the workspace, and this build is what everyone else sees.
        Other users fetch it with `GET .../previews/current`.
      operationId: generatePreview
      tags:
        - Previews
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/PfsType'
        - $ref: '#/components/parameters/ClientId'
      responses:
        '200':
          description: Preview generated successfully
          content:
            text/html:
              schema:
                type: string
                description: HTML content of the preview
        '202':
          description: Preview generation in progress
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Preview generation started"
        '403':
          description: Forbidden - only the workspace owner can generate the preview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Workspace not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /workspaces/{workspaceId}/previews/current:
    get:
      summary: Get the current preview
      description: |
        The owner's last generated preview for the workspace's PFS list, as `POST .../previews`
        returned it, without building anything. For any user with access. Clients call it on
        `preview.generated` and when `workspace.updated` changes `pfs`.
      operationId: getCurrentPreview
      tags:
        - Previews
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      responses:
        '200':
          description: The current preview
          content:
            text/html:
              schema:
                type: string
                description: HTML content of the preview
        '404':
          description: Workspace not found, or the owner has not generated a preview for the workspace's PFS list yet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /workspaces/{workspaceId}/previews/{filePath}:
    get:
      summary: Return static assets for the preview
      description: Returns static assets for the preview of the current workspace state
      operationId: getPreviewAsset
      tags:
        - Previews
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/FilePath'
        - $ref: '#/components/parameters/PfsType'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: File content
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Last-Modified:
              $ref: '#/components/headers/LastModified'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '304':
          description: Cached copy is still current; no body is returned.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
        '404':
          description: File not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /workspaces/{workspaceId}/download:
    get:
      summary: Download preview document
      description: |
        Downloads the preview document for the current workspace state.

        The owner builds the document; other users get the document of the owner's last preview
        build for the workspace's PFS list (404 if there is none) and a 403 for any other `pfs`
        value.
      operationId: downloadPreviewDocument
      tags:
        - Previews
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/PfsType'
        - $ref: '#/components/parameters/DocumentFormat'
        - $ref: '#/components/parameters/ClientId'
      responses:
        '200':
          description: Preview document content downloaded successfully
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            application/vnd.openxmlformats-officedocument.wordprocessingml.document:
              schema:
                type: string
                format: binary
        '403':
          description: Forbidden - missing `X-Client-Id`, or only the workspace owner can change the PFS selection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Workspace not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /workspaces/{workspaceId}/proposal:
    get:
      summary: Get proposal information
      description: |
        Retrieves information about the proposal (GitHub Pull Request) for the workspace changes.

        This endpoint returns the current state of the PR including title, description, draft status,
        and whether the PR has been closed or merged.

        Owner only - the Propose view (and this data) is not exposed to collaborators at all,
        even in read-only form.
      operationId: getProposal
      tags:
        - Workspaces
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/ClientId'
      responses:
        '200':
          description: Proposal information retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Proposal'
        '204':
          description: No proposal exists for the workspace
        '404':
          description: Workspace not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden - missing `X-Client-Id`, or only the workspace owner can view the proposal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    put:
      summary: Create or update proposal
      description: |
        Creates a new proposal (GitHub Pull Request) or updates an existing one for the workspace changes.

        **Creating a new proposal:**

        - Opens a new GitHub PR with the provided title and description
        - The PR is marked as draft by default

        **Updating an existing proposal:**

        - Updates the PR title and/or description
        - The draft/ready status can be changed (due to current limitations in the GitHub REST API)
        - Could potentially close or reopen the PR
      operationId: createOrUpdateProposal
      tags:
        - Workspaces
      parameters:
        - $ref: '#/components/parameters/ClientId'
        - $ref: '#/components/parameters/WorkspaceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Input for creating or updating a proposal
              required:
                - title
                - description
              properties:
                title:
                  $ref: '#/components/schemas/ProposalTitle'
                description:
                  $ref: '#/components/schemas/ProposalDescription'
                state:
                  type: string
                  enum:
                    - open
                    - closed
                  description: |
                    Desired state of the PR.

                    - "open": PR should be open and can receive commits/updates
                    - "closed": PR should be closed without merging (withdrawn)

                    If a PR can't be opened or closed (e.g. because missing permissions or being merged),
                    a 409 Conflict error will be returned.
      responses:
        '200':
          description: Proposal created/updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Proposal'
        '400':
          description: Invalid request data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Workspace not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflict with existing state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden - only the workspace owner can propose changes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /workspaces/{workspaceId}/commits:
    get:
      summary: List workspace commits
      description: |
        Retrieves the list of git commits in the workspace.

        Owner only - surfaced exclusively in the Propose view, which is not exposed to collaborators.
      operationId: listWorkspaceCommits
      tags:
        - Workspaces
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      responses:
        '200':
          description: List of commits
          content:
            application/json:
              schema:
                type: object
                properties:
                  commits:
                    type: array
                    items:
                      $ref: '#/components/schemas/Commit'
        '404':
          description: Workspace not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden - only the workspace owner can view commits
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /workspaces/{workspaceId}/sync:
    post:
      summary: Sync workspace with remote changes
      description: >-
        Fetches the fork remote and merges remote branch changes into the local workspace when safe.

        Fast-forwards when possible, creates a merge commit when histories diverged but merge cleanly,
        and aborts without touching the working tree when the merge would conflict or when uncommitted
        local changes exist. Conflict and dirty outcomes are reported in the response body, not as HTTP errors.

        Owner only: the sync uses the caller's GitHub credentials and rewrites the working tree.
        When files changed (`updated` or `merged`), a `workspace.synced` event is published to the
        workspace's realtime subscribers.
      operationId: syncWorkspaceRepository
      tags:
        - Workspaces
      parameters:
        - $ref: '#/components/parameters/ClientId'
        - $ref: '#/components/parameters/WorkspaceId'
      responses:
        '200':
          description: Sync outcome
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncResult'
        '400':
          description: Workspace is archived
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden - only the workspace owner can sync the workspace
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Workspace not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Fetching or merging remote changes failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /workspaces/{workspaceId}/pfs:
    get:
      summary: List available PFS types
      description: Retrieves all available PFS types for the workspace
      operationId: listWorkspacePFSTypes
      tags:
        - PFS
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      responses:
        '200':
          description: Available PFS types
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/pfsTypes'
        '404':
          description: Workspace not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      summary: Create new PFS
      description: >-
        Creates a new PFS based on an existing one.

        Validation may take place, e.g. validating against the strictyaml schemas of the corresponding YAML files.
      operationId: createPFS
      tags:
        - PFS
      parameters:
        - $ref: '#/components/parameters/ClientId'
        - $ref: '#/components/parameters/WorkspaceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - id
                - title
              properties:
                base:
                  type:
                    - string
                    - "null"
                  description: Existing PFS to base the new one on
                  default: null
                id:
                  type: string
                  description: ID for the new PFS
                title:
                  type: string
                  description: Title for the new PFS
                version:
                  type: string
                  description: Version of the new PFS
                  default: "1.0.0-draft"
                type:
                  type: string
                  description: Type of the new PFS
                  enum:
                    - Optical
                    - SAR
                applies_to:
                  type: string
                  description: Description of the new PFS
                introduction:
                  type: array
                  items:
                    type: string
                  default:
                    - what-are-ceos-ard-products
                    - when-is-a-product-ceos-ard
                    - difference-threshold-goal
      responses:
        '201':
          description: PFS created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileItem'
        '400':
          description: Invalid request data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Workspace not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /workspaces/{workspaceId}/collaborators:
    get:
      summary: List the collaborators of a workspace
      description: |
        Retrieves everyone with access to the workspace - both direct grants
        and users who joined through a share - along with their mode and
        status. Owner only.
      operationId: listWorkspaceCollaborators
      tags:
        - Sharing
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      responses:
        '200':
          description: List of collaborators
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Collaborator'
        '404':
          description: Workspace not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden - only the workspace owner can view collaborators
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      summary: Add collaborators by GitHub username
      description: |
        Grants one or more GitHub users access to the workspace at the given
        mode. Owner only.

        - If a given username already belongs to an onboarded CEOS-ARD user,
          that person has access right away; it appears next time they view
          their workspaces ("Shared with me").
        - If a given username hasn't onboarded yet, the grant is recorded as
          `pending` and activates automatically the moment that person signs
          in with GitHub for the first time.
        - Adding a username that already is a collaborator on this
          workspace updates the existing entry's mode (and reactivates it if
          it was previously `revoked`) rather than creating a duplicate.
      operationId: addWorkspaceCollaborators
      tags:
        - Sharing
      parameters:
        - $ref: '#/components/parameters/ClientId'
        - $ref: '#/components/parameters/WorkspaceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CollaboratorCreateRequest'
      responses:
        '201':
          description: Collaborators added or updated successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Collaborator'
        '400':
          description: |
            Invalid request data.

            Possible errors:
            - `github_usernames` empty or missing
            - Invalid mode
            - Owner's own username included in `github_usernames`
            - One or more `github_usernames` do not correspond to a real GitHub user (validated
              against the GitHub API; the response names exactly which ones failed). This check
              runs before any collaborators are added - the whole request is rejected atomically if
              any username is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Workspace not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden - only the workspace owner can add collaborators
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /workspaces/{workspaceId}/collaborators/{collaboratorId}:
    patch:
      summary: Change a collaborator's access mode
      description: Updates the mode (readonly) of an existing collaborator. Owner only. The affected user receives `collaborator.updated`.
      operationId: updateWorkspaceCollaborator
      tags:
        - Sharing
      parameters:
        - $ref: '#/components/parameters/ClientId'
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/CollaboratorId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CollaboratorUpdateRequest'
      responses:
        '200':
          description: Collaborator updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Collaborator'
        '404':
          description: Workspace or collaborator not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden - only the workspace owner can manage collaborators
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      summary: Revoke a collaborator's access
      description: |
        Revokes a person's access to the workspace, whether added by username or joined through a share.
        Takes effect immediately on their next request. Revocation is sticky:
        if they still hold a share for this workspace, opening it again will
        not restore access - the owner must add them again. Owner only.
      operationId: revokeWorkspaceCollaborator
      tags:
        - Sharing
      parameters:
        - $ref: '#/components/parameters/ClientId'
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/CollaboratorId'
      responses:
        '204':
          description: Collaborator revoked successfully
        '404':
          description: Workspace or collaborator not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden - only the workspace owner can manage collaborators
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /workspaces/{workspaceId}/shares:
    get:
      summary: List shares for a workspace
      description: Retrieves all shares of a workspace. Owner only.
      operationId: listWorkspaceShares
      tags:
        - Sharing
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      responses:
        '200':
          description: List of shares
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Share'
        '404':
          description: Workspace not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden - only the workspace owner can view shares
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      summary: Create a share
      description: |
        Generates a mode-bound share for the workspace. Its token is random and
        stored with the share, so rotating `SECRET_KEY` does not break existing
        shares. Anyone who opens the share's link is granted access with this mode once they're
        authenticated.

        A share is an invitation: whoever opens its link logs in with GitHub and is
        then granted access with the share's mode. The mode is looked up on
        every use, so the owner can change it without reissuing the URL;
        it does not change the mode already granted to people who joined
        earlier. Deleting a share is permanent and stops new people from
        joining; those who joined keep their access.
      operationId: createWorkspaceShare
      tags:
        - Sharing
      parameters:
        - $ref: '#/components/parameters/ClientId'
        - $ref: '#/components/parameters/WorkspaceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShareCreateRequest'
      responses:
        '201':
          description: Share created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Share'
        '400':
          description: Invalid mode or expires_at
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Workspace not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden - only the workspace owner can create shares
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /workspaces/{workspaceId}/shares/{shareId}:
    patch:
      summary: Update a share
      description: |
        Changes a share's mode and/or expiry. Owner only. To stop a share,
        delete it.
      operationId: updateWorkspaceShare
      tags:
        - Sharing
      parameters:
        - $ref: '#/components/parameters/ClientId'
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/ShareId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShareUpdateRequest'
      responses:
        '200':
          description: Share updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Share'
        '404':
          description: Workspace or share not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden - only the workspace owner can manage shares
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      summary: Delete a share
      description: |
        Permanently deletes a share. Its URL stops working immediately
        and is not reversible - sharing again means creating a new share,
        which produces a new URL. Owner only.
      operationId: deleteWorkspaceShare
      tags:
        - Sharing
      parameters:
        - $ref: '#/components/parameters/ClientId'
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/ShareId'
      responses:
        '204':
          description: Share deleted successfully
        '404':
          description: Workspace or share not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden - only the workspace owner can manage shares
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /shares/{token}:
    get:
      summary: Preview a share
      description: |
        What a share leads to, for the share page before login. Public and free of
        sensitive data: the workspace title, the owner's name and the mode.
      operationId: getSharePreview
      tags:
        - Sharing
      security: []
      parameters:
        - $ref: '#/components/parameters/ShareToken'
      responses:
        '200':
          description: Share preview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharePreview'
        '404':
          description: Invalid, expired, or deleted share
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /shares/{token}/redeem:
    post:
      summary: Redeem a share
      description: |
        Grants the logged-in GitHub user access to the shared workspace with
        the share's mode. Visitors who aren't logged in get a plain `401`; the
        share page shows them `GET /shares/{token}` instead and redeems
        after the login.
      operationId: redeemShare
      tags:
        - Sharing
      parameters:
        - $ref: '#/components/parameters/ClientId'
        - $ref: '#/components/parameters/ShareToken'
      responses:
        '200':
          description: Access granted (or already held); returns the resulting collaborator entry and workspace
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RedeemResponse'
        '401':
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Logged in with another provider than GitHub, or this user's access was previously revoked by the owner
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Invalid, expired, or deleted share
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: __Host-session
      description: |
        The browser session: the JWT in an HttpOnly cookie set by the OAuth callback. Requests
        that change data (POST, PUT, PATCH, DELETE) authenticated this way must send
        `X-Client-Id`, otherwise they are rejected with `403`. GET requests never change data.
        With `SESSION_COOKIE_SECURE=false` (local HTTP development only) the cookie is called
        `ceos_ard_session` and is not `Secure`.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: The same JWT as a header, for scripts and tests. Takes precedence over the cookie; no `X-Client-Id` needed.

  parameters:
    WorkspaceId:
      name: workspaceId
      in: path
      required: true
      description: Unique identifier of the workspace
      schema:
        type: string
        format: uuid

    ClientId:
      name: X-Client-Id
      in: header
      required: false
      description: |
        Random id of the client (browser tab) making the request, generated per page load. The
        realtime events this request causes are withheld from that client's own WebSocket (which
        presents the same id as `client_id`), while other tabs and devices of the same user still
        receive them. Never sent to other clients.

        Required on POST, PUT, PATCH and DELETE requests without an `Authorization` header
        (cross-site request protection for the session cookie), and on the GET requests that
        change data (`GET /workspaces/{workspaceId}`, `.../proposal`, `.../download`); those are
        rejected with `403`.
      schema:
        type: string
        pattern: '^[A-Za-z0-9_-]{8,64}$'

    FilePath:
      name: filePath
      in: path
      required: true
      description: Path to the file
      schema:
        type: string

    PfsType:
      name: pfs
      in: query
      style: form
      explode: true
      description: |-
        PFS type for preview generation.

        If not provided, uses the default PFS type(s) that have been selected during workspace creation.
      schema:
        type: array
        items:
          type: string

    DocumentFormat:
      name: format
      in: query
      required: true
      description: Format of the downloaded preview document.
      schema:
        type: string
        enum:
          - pdf
          - docx

    CollaboratorId:
      name: collaboratorId
      in: path
      required: true
      description: Unique identifier of the collaborator entry
      schema:
        type: string
        format: uuid

    ShareId:
      name: shareId
      in: path
      required: true
      description: Unique identifier of the share
      schema:
        type: string
        format: uuid

    ShareToken:
      name: token
      in: path
      required: true
      description: |
        Random, mode-bound share token from `{clientUrl}/share/{token}`.
        Invitee-agnostic - not tied to any specific identity, and not a
        session/JWT access token. Grants no access by itself; only
        `POST /shares/{token}/redeem` (as a logged-in user) does, while
        `GET /shares/{token}` shows a public preview.
      schema:
        type: string

    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: Cached ETag to revalidate; if it still matches, the server returns 304 instead of the asset.
      schema:
        type: string
      example: '"5d41402abc4b2a76b9719d911017c592"'

  headers:
    ETag:
      description: Asset validator; send it in If-None-Match to revalidate.
      schema:
        type: string
      example: '"5d41402abc4b2a76b9719d911017c592"'

    LastModified:
      description: When the asset was last modified.
      schema:
        type: string
      example: 'Mon, 27 Jul 2026 10:00:00 GMT'

    CacheControl:
      description: Always no-cache; store but revalidate before reuse.
      schema:
        type: string
      example: 'no-cache'

  schemas:
    Error:
      type: object
      description: |
        The error body of every non-2xx response: a message in `detail`, or for a `422` the list
        of field errors.
      required:
        - detail
      properties:
        detail:
          oneOf:
            - type: string
            - type: array
              items:
                type: object

    ProposalTitle:
      type: string
      description: Title of the proposal (GitHub Pull Request)
      minLength: 1
      maxLength: 200
    ProposalDescription:
      type:
        - string
        - "null"
      description: Description/body of the proposal (GitHub Pull Request) (supports Markdown)
      minLength: 1
      maxLength: 10000
    CommitMessage:
      type: string
      description: Commit message
      minLength: 1
      maxLength: 500
    ProposalDraft:
      type: boolean
      description: |
        Whether the proposal (GitHub Pull Request) is marked as a draft.

        - true: PR is a draft and not ready for review
        - false: PR is ready for review

        If a proposal exists, the default is taken from the existing PR state.
        If no proposal exists, the default is `true` (draft).
      default: true

    Proposal:
      type: object
      description: |
        Represents a proposal (GitHub Pull Request) for workspace changes.
        Users should poll this resource to stay informed about changes to the PR status.
      required:
        - number
        - url
        - title
        - description
        - state
        - draft
      properties:
        number:
          type: integer
          description: GitHub PR number
        url:
          type: string
          format: uri
          description: URL to the GitHub PR
        title:
          $ref: '#/components/schemas/ProposalTitle'
        description:
          $ref: '#/components/schemas/ProposalDescription'
        state:
          type: string
          enum:
            - open
            - closed
            - merged
          description: |
            Current state of the PR.

            - "open": PR is open and can receive commits/updates
            - "closed": PR was closed without merging (withdrawn), or closed by GitHub
              because the fork was deleted (see "detached")
            - "merged": PR was merged into the main branch
        draft:
          $ref: '#/components/schemas/ProposalDraft'
        detached:
          type: boolean
          default: false
          description: |
            True when the fork this PR was opened from has been deleted on GitHub.

            GitHub closes such a PR and permanently unlinks it from the head repository, so it
            can never be reopened: a re-fork is a new repository and there is no way to
            repoint a PR's head. Clients must not offer a reopen action for these. Proposing
            again opens a new PR carrying the title and description across, with a link back
            to this one so its review comments remain reachable.

    Commit:
      type: object
      required:
        - sha
        - message
        - timestamp
        - author
      properties:
        sha:
          type: string
          description: Commit SHA
        message:
          $ref: '#/components/schemas/CommitMessage'
        timestamp:
          type: string
          format: date-time
          description: Commit timestamp
        author:
          type: string
          description: Name of the commit author

    CommitResult:
      allOf:
        - $ref: '#/components/schemas/Commit'
        - type: object
          properties:
            merged_remote:
              type: boolean
              default: false
              description: True when remote changes from the fork were merged into the workspace as part of the commit

    SyncResult:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - up_to_date
            - updated
            - merged
            - conflict
            - dirty
            - remote_missing
            - remote_restored
          description: |
            Outcome of the sync.

            - "up_to_date": no remote changes to pull
            - "updated": local branch fast-forwarded to the remote branch
            - "merged": remote changes merged into the local branch with a merge commit
            - "conflict": remote changes conflict with local changes; repository left untouched
            - "dirty": uncommitted local changes present; merge skipped
            - "remote_missing": the workspace branch no longer exists on the fork
            - "remote_restored": the workspace branch was missing on the fork and was pushed
              back from the local history
        ahead_commits:
          type: integer
          default: 0
          description: Number of local commits not on the remote branch
        behind_commits:
          type: integer
          default: 0
          description: Number of remote commits not in the local branch
        pulled_commits:
          type: integer
          default: 0
          description: Number of remote commits applied by this sync
        conflicting_files:
          type: array
          items:
            type: string
          default: []
          description: Paths of conflicting files when status is "conflict"
        repaired:
          type: boolean
          default: false
          description: |
            True when the fork itself was missing on GitHub and had to be recreated before the
            sync could run. The workspace branch is pushed back from the local history, so no
            work is lost, but any open pull request was permanently closed by GitHub and must
            be submitted again as a new one.

    Workspace:
      type: object
      required:
        - id
        - name
        - description
        - repository
        - branch
        - pfs
        - created
        - pr
        - user_id
      properties:
        id:
          type: string
          format: uuid
          description: Unique workspace identifier
        title:
          type: string
          description: Workspace title
        description:
          type: string
          description: Workspace description
        repository:
          type: string
          format: uri
          description: URL of the Git repository for the workspace
        branch:
          type: string
          description: Name of the branch in the repository
        pfs:
          $ref: '#/components/schemas/pfs'
        created:
          type: string
          format: date-time
          description: Workspace creation timestamp
        status:
          type: string
          enum:
            - active
            - archived
          description: |
            Workspace status.

            - "archived": Workspace has been archived (manually or due to merged/closed PR)
            - "active": Workspace is active and can be worked on
        archived_at:
          type:
            - string
            - "null"
          format: date-time
          description: |
            Timestamp when workspace was archived.

            Set automatically when status changes to "archived".
            Cleared when workspace is reactivated.
          default: null
        deletion_at:
          type:
            - string
            - "null"
          format: date-time
          description: |
            Scheduled permanent deletion timestamp (computed as archived_at + 1 month).

            **Note**: This is a computed property, not stored in the database.
            After this time, workspace files and database record will be permanently deleted by cleanup script.
            Automatically null when workspace is not archived.
          default: null
          readOnly: true
        pr:
          type:
            - string
            - "null"
          description: ID to the GitHub PR
          default: null
        pr_status:
          type:
            - string
            - "null"
          enum:
            - unknown
            - open
            - approved
            - closed
            - merged
            - null
          description: Status of the PR
          default: null
        user_id:
          type: string
          description: The user ID of the workspace owner
        owner_username:
          type:
            - string
            - "null"
          description: GitHub username of the workspace owner
          default: null
        owner_full_name:
          type:
            - string
            - "null"
          description: Full name of the workspace owner
          default: null
        viewer_role:
          type: string
          enum:
            - owner
            - readonly
          readOnly: true
          description: |
            The current authenticated user's effective role on this workspace.

            Computed per-request; not stored. Always "owner" for the workspace
            creator. For collaborators, reflects their accepted collaborator mode,
            clamped to "readonly" while the workspace is archived.

    WorkspaceEventType:
      type: string
      enum:
        - file.saved
        - file.created
        - file.deleted
        - file.renamed
        - file.reverted
        - file.committed
        - workspace.synced
        - workspace.updated
        - preview.generated
        - collaborator.revoked
        - collaborator.updated
        - workspace.archived
        - workspace.deleted
      description: |
        Kind of `WorkspaceEvent`.

        - `file.saved`: file overwritten via `PUT .../files/{filePath}`.
        - `file.created`: file/folder created via `POST .../files` or a new PFS via `POST .../pfs`.
        - `file.deleted`: file/folder deleted via `DELETE .../files/{filePath}` (see `tracked`).
        - `file.renamed`/`file.reverted`: `PATCH .../files/{filePath}` with `operation: rename`/`revert`.
        - `file.committed`: changes committed via `PUT .../diffs`.
        - `workspace.synced`: the owner synced the workspace with GitHub (`POST .../sync`, or the automatic merge on `PUT .../diffs`) and files changed on disk at arbitrary depth; reload the file tree and open files (see `status`).
        - `workspace.updated`: title, description, PFS list or status changed via `PATCH .../{workspaceId}` (see `fields`); refetch the workspace. Archiving sends `workspace.archived` instead.
        - `preview.generated`: the owner generated the preview via `POST .../previews` (see `pfs`); every other client fetches `GET .../previews/current`.
        - `collaborator.revoked`: access revoked via `DELETE .../collaborators/{collaboratorId}`; sent only to the target (see `target_user_id`) and closes their connection.
        - `collaborator.updated`: the owner changed the target's mode via `PATCH .../collaborators/{collaboratorId}`; sent only to the target, who refetches the workspace for its new `viewer_role`.
        - `workspace.archived`: workspace archived via `PATCH .../{workspaceId}`.
        - `workspace.deleted`: workspace deleted via `DELETE .../{workspaceId}`; closes the connection for everyone.

    WorkspaceEvent:
      description: |
        JSON payload of each realtime message pushed over the workspace WebSocket connection.

        Contract rules:
        - Every event embeds the response body of the REST operation that caused it, unmodified,
          under a stable key: `file` for FileItem-shaped bodies, `commit` for the Commit body.
          Envelope fields (`path`, `old_path`, `tracked`, `changes`, `target_user_id`) add context
          but never rename or reshape REST fields. Known exception: `file.deleted` of an untracked
          file responds `204 No Content` on REST while the event still carries the `file` snapshot.
        - Deleting or renaming a folder produces a single event for the folder itself - no
          per-child events. Affected children are implied by the path prefix.
        - `seq` is an in-memory counter and resets when the server restarts; use it for
          ordering/debugging only.

        This envelope is also the event format of the client-side event bus in ceos-ard-editor
        (`src/services/events.js`), which adds a client-only `source: local|remote` field and
        client-only `realtime.*` event types that never appear on the wire. Should this WebSocket
        ever carry more than these notification events (e.g. the planned CRDT/presence frames),
        consider splitting the realtime contract into an AsyncAPI document.

        The Python source of truth is `app/schemas/events.py`; `scripts/check_event_contract.py`
        (pre-commit) keeps the two in sync.
      oneOf:
        - $ref: '#/components/schemas/WorkspaceEventFileSaved'
        - $ref: '#/components/schemas/WorkspaceEventFileCreated'
        - $ref: '#/components/schemas/WorkspaceEventFileDeleted'
        - $ref: '#/components/schemas/WorkspaceEventFileRenamed'
        - $ref: '#/components/schemas/WorkspaceEventFileReverted'
        - $ref: '#/components/schemas/WorkspaceEventFileCommitted'
        - $ref: '#/components/schemas/WorkspaceEventWorkspaceSynced'
        - $ref: '#/components/schemas/WorkspaceEventWorkspaceUpdated'
        - $ref: '#/components/schemas/WorkspaceEventPreviewGenerated'
        - $ref: '#/components/schemas/WorkspaceEventCollaboratorRevoked'
        - $ref: '#/components/schemas/WorkspaceEventCollaboratorUpdated'
        - $ref: '#/components/schemas/WorkspaceEventWorkspaceArchived'
        - $ref: '#/components/schemas/WorkspaceEventWorkspaceDeleted'
      discriminator:
        propertyName: type
        mapping:
          file.saved: '#/components/schemas/WorkspaceEventFileSaved'
          file.created: '#/components/schemas/WorkspaceEventFileCreated'
          file.deleted: '#/components/schemas/WorkspaceEventFileDeleted'
          file.renamed: '#/components/schemas/WorkspaceEventFileRenamed'
          file.reverted: '#/components/schemas/WorkspaceEventFileReverted'
          file.committed: '#/components/schemas/WorkspaceEventFileCommitted'
          workspace.synced: '#/components/schemas/WorkspaceEventWorkspaceSynced'
          workspace.updated: '#/components/schemas/WorkspaceEventWorkspaceUpdated'
          preview.generated: '#/components/schemas/WorkspaceEventPreviewGenerated'
          collaborator.revoked: '#/components/schemas/WorkspaceEventCollaboratorRevoked'
          collaborator.updated: '#/components/schemas/WorkspaceEventCollaboratorUpdated'
          workspace.archived: '#/components/schemas/WorkspaceEventWorkspaceArchived'
          workspace.deleted: '#/components/schemas/WorkspaceEventWorkspaceDeleted'

    WorkspaceEventBase:
      type: object
      description: Fields shared by all realtime workspace events.
      required:
        - type
        - seq
        - ts
        - actor_user_id
      properties:
        type:
          $ref: '#/components/schemas/WorkspaceEventType'
        seq:
          type: integer
          description: >-
            Opaque process-wide counter, for ordering/debug only. Resets on server restart.
        ts:
          type: string
          format: date-time
          description: Server timestamp when published.
        actor_user_id:
          type:
            - string
            - "null"
          description: User who caused the event, or `null` if system-generated. The server already withholds an event from the client that caused it (same user and `client_id`); other clients of that user do receive it.
        path:
          type:
            - string
            - "null"
          default: null
          description: Path of the affected file. `null` for events not scoped to a file.
        file:
          default: null
          description: Snapshot of the affected file/folder. `null` for events not scoped to a file.
          oneOf:
            - $ref: '#/components/schemas/FileItem'
            - type: "null"

    WorkspaceEventFileSaved:
      description: File overwritten via `PUT .../files/{filePath}`. `file` equals the REST response body; `path` equals `file.path`.
      allOf:
        - $ref: '#/components/schemas/WorkspaceEventBase'
        - type: object
          required:
            - path
            - file
          properties:
            type:
              const: file.saved
            path:
              type: string
            file:
              $ref: '#/components/schemas/FileItem'

    WorkspaceEventFileCreated:
      description: File/folder created via `POST .../files`, or a new PFS folder via `POST .../pfs`. `file` equals the REST response body; `path` equals `file.path`.
      allOf:
        - $ref: '#/components/schemas/WorkspaceEventBase'
        - type: object
          required:
            - path
            - file
          properties:
            type:
              const: file.created
            path:
              type: string
            file:
              $ref: '#/components/schemas/FileItem'

    WorkspaceEventFileDeleted:
      description: |
        File/folder deleted via `DELETE .../files/{filePath}`. Deleting a folder produces this
        single event; its contents are implied by the path prefix. Unlike the REST response
        (which is `204 No Content` for untracked deletes), the event always carries `file`.
      allOf:
        - $ref: '#/components/schemas/WorkspaceEventBase'
        - type: object
          required:
            - path
            - file
            - tracked
          properties:
            type:
              const: file.deleted
            path:
              type: string
              description: Path of the deleted file/folder.
            file:
              $ref: '#/components/schemas/FileItem'
            tracked:
              type: boolean
              description: Whether the file was git-tracked (delete is revertible, the entry keeps a `deleted` status) or untracked (removed permanently).

    WorkspaceEventFileRenamed:
      description: |
        File/folder renamed via `PATCH .../files/{filePath}` with `operation: rename`. Renaming a
        folder produces this single event; its contents are implied by the path prefix.
        `file` equals the REST response body (the renamed item, `file.path` is the new path).
      allOf:
        - $ref: '#/components/schemas/WorkspaceEventBase'
        - type: object
          required:
            - path
            - old_path
            - file
          properties:
            type:
              const: file.renamed
            path:
              type: string
              description: The pre-rename path (legacy semantics; equals `old_path`). The new path is `file.path`.
            old_path:
              type: string
              description: The pre-rename path.
            file:
              $ref: '#/components/schemas/FileItem'

    WorkspaceEventFileReverted:
      description: |
        File reverted via `PATCH .../files/{filePath}` with `operation: revert`. `file` equals the
        REST response body. `old_path` is present only when the revert undid a staged rename
        (i.e. `file.path` differs from the requested path).
      allOf:
        - $ref: '#/components/schemas/WorkspaceEventBase'
        - type: object
          required:
            - path
            - file
          properties:
            type:
              const: file.reverted
            path:
              type: string
              description: The path the revert was requested for.
            old_path:
              type: string
              description: Present when the revert undid a staged rename; equals `path`.
            file:
              $ref: '#/components/schemas/FileItem'

    WorkspaceEventFileCommitted:
      description: |
        Changes committed (and pushed) via `PUT .../diffs`. `commit` equals the REST response
        body. Not scoped to a single file (`path`/`file` are `null`); the committed files are
        listed in `changes` with /-rooted paths.
      allOf:
        - $ref: '#/components/schemas/WorkspaceEventBase'
        - type: object
          required:
            - commit
            - changes
          properties:
            type:
              const: file.committed
            commit:
              $ref: '#/components/schemas/Commit'
            changes:
              type: array
              items:
                $ref: '#/components/schemas/CommitChange'
              description: The changes included in the commit. Paths start from the workspace root (leading `/`).

    WorkspaceEventCollaboratorRevoked:
      description: |
        Access revoked via `DELETE .../collaborators/{collaboratorId}`. Delivered only to the affected user
        (see `target_user_id`) and closes their connection - terminal event.
      allOf:
        - $ref: '#/components/schemas/WorkspaceEventBase'
        - type: object
          required:
            - target_user_id
          properties:
            type:
              const: collaborator.revoked
            target_user_id:
              type: string
              description: The user id this event is delivered to (never broadcast to other subscribers).

    WorkspaceEventCollaboratorUpdated:
      description: |
        The owner changed this user's access mode via `PATCH .../collaborators/{collaboratorId}`. Delivered only
        to the affected user (see `target_user_id`), who refetches the workspace for its new
        `viewer_role`.
      allOf:
        - $ref: '#/components/schemas/WorkspaceEventBase'
        - type: object
          required:
            - target_user_id
            - mode
          properties:
            type:
              const: collaborator.updated
            target_user_id:
              type: string
              description: The user id this event is delivered to (never broadcast to other subscribers).
            mode:
              $ref: '#/components/schemas/AccessMode'

    WorkspaceEventWorkspaceArchived:
      description: |
        Workspace archived via `PATCH .../{workspaceId}`. Deliberately carries no workspace
        payload: the Workspace resource contains the per-viewer `viewer_role` (computed per
        request and clamped while archived), so a single broadcast body would be wrong for some
        subscribers - clients refetch the workspace instead.
      allOf:
        - $ref: '#/components/schemas/WorkspaceEventBase'
        - type: object
          properties:
            type:
              const: workspace.archived

    WorkspaceEventWorkspaceUpdated:
      description: |
        Workspace metadata changed via `PATCH .../{workspaceId}`: the title, description, PFS list
        or status (a reactivation; archiving sends `workspace.archived`). Carries only the names of
        the changed fields, for the same reason as `workspace.archived`: clients refetch the
        workspace. A changed PFS list is the owner's preview selection, which every viewer follows.
      allOf:
        - $ref: '#/components/schemas/WorkspaceEventBase'
        - type: object
          required:
            - fields
          properties:
            type:
              const: workspace.updated
            fields:
              type: array
              minItems: 1
              items:
                type: string
                enum:
                  - title
                  - description
                  - pfs
                  - status

    WorkspaceEventPreviewGenerated:
      description: |
        The owner generated the preview via `POST .../previews` for the PFS list in `pfs` (the
        workspace's `pfs`). Only the owner builds; viewers, commenters and the owner's other tabs
        fetch the result with `GET .../previews/current` instead of building themselves.
      allOf:
        - $ref: '#/components/schemas/WorkspaceEventBase'
        - type: object
          required:
            - pfs
          properties:
            type:
              const: preview.generated
            pfs:
              type: array
              items:
                type: string
              description: The PFS list the preview was generated for.

    WorkspaceEventWorkspaceDeleted:
      description: |
        Workspace deleted via `DELETE .../{workspaceId}`. Closes the connection for every
        subscriber - terminal event. Carries no payload.
      allOf:
        - $ref: '#/components/schemas/WorkspaceEventBase'
        - type: object
          properties:
            type:
              const: workspace.deleted

    WorkspaceEventWorkspaceSynced:
      description: |
        The owner synced the workspace with its GitHub branch (`POST .../sync`, or the automatic
        merge when a commit's push was rejected) and the working tree was fast-forwarded or merged.
        Files may have been added, changed, deleted or renamed at any depth, so subscribers reload
        the file tree and their open files instead of applying single-file changes. When triggered
        by a commit it follows the `file.committed` event.
      allOf:
        - $ref: '#/components/schemas/WorkspaceEventBase'
        - type: object
          required:
            - status
          properties:
            type:
              const: workspace.synced
            status:
              type: string
              enum:
                - updated
                - merged
              description: Whether the branch was fast-forwarded (`updated`) or a merge commit was created (`merged`).

    CommitChange:
      type: object
      description: |
        A single changed file, as pending in the workspace (`GET .../diffs`) or as included in a
        commit (`file.committed` event). Note the path form differs: the `GET .../diffs` response
        uses repo-relative paths (no leading slash), while the `file.committed` event uses
        /-rooted paths consistent with `FileItem.path`.
      required:
        - path
        - status
      properties:
        path:
          type: string
          description: Path of the changed file.
        status:
          type: string
          enum:
            - added
            - modified
            - deleted
            - renamed
          description: Git status of the change.
        source:
          type: string
          description: Previous path of the file; only present when `status` is `renamed`.

    FileItem:
      type: object
      required:
        - name
        - path
      properties:
        name:
          type: string
          description: File or folder name
        path:
          type: string
          description: Absolute path to the file/folder starting from the workspace root
        is_directory:
          type: boolean
          description: Whether the item is a Directory
          default: false
        status:
          type:
            - string
            - "null"
          enum:
            - added
            - modified
            - deleted
            - renamed
            - null
          default: null
          description: |-
            Status of the file

            - *null*=Unchanged
            - added=Added
            - modified=Modified
            - deleted=Deleted
            - renamed=Renamed

    pfs:
      description: List of PFS types assigned to the workspace, used for preview generation.
      type: array
      items:
        $ref: '#/components/schemas/pfsId'
      example:
        - NRB
        - POL

    pfsTypes:
      type: object
      required:
        - pfs_types
      properties:
        pfs_types:
          type: array
          items:
            type: object
            required:
              - id
            properties:
              id:
                $ref: '#/components/schemas/pfsId'
              title:
                type: string
                description: Human-readable title
            example:
              id: NRB
              title: SAR Normalised Radar Backscatter

    pfsId:
      type: string
      description: PFS type identifier
      pattern: ^[A-Z0-9][A-Z0-9-]*[A-Z0-9]$
      example: NRB

    AccessMode:
      type: string
      enum:
        - readonly
      description: |
        Access level granted to a collaborator.

        - "readonly": Can view the workspace and its files, cannot make
          changes. Equivalent to viewing an archived workspace.

    CollaboratorStatus:
      type: string
      enum:
        - pending
        - accepted
        - revoked
      description: |
        Lifecycle status of a collaborator.

        - "pending": Granted by GitHub username to someone who hasn't
          onboarded to CEOS-ARD yet. Resolves to "accepted" automatically
          the moment they first sign in with GitHub.
        - "accepted": Active access, either granted immediately (existing
          user, or via a redeemed share) or auto-resolved from
          "pending".
        - "revoked": Owner removed access. Sticky: reusing a share the
          person still holds does not restore it.

    Collaborator:
      type: object
      description: |
        A single collaborator's access grant on a workspace, however it was
        created - added by username, or by redeeming a share (see
        `share_id`). There is no separate "invitation" object: this row
        *is* the grant, from the moment it's created.
      required:
        - id
        - workspace_id
        - mode
        - status
        - invitee_github_username
        - invited_by_user_id
        - created_at
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier of the collaborator entry
        workspace_id:
          type: string
          format: uuid
          description: ID of the workspace this collaborator belongs to
        share_id:
          type:
            - string
            - "null"
          format: uuid
          description: |
            ID of the share this grant was created through, if any.
            Null for collaborators added directly by username. Provenance only -
            does not affect permission evaluation.
          default: null
        mode:
          $ref: '#/components/schemas/AccessMode'
        status:
          $ref: '#/components/schemas/CollaboratorStatus'
        invitee_github_username:
          type: string
          description: GitHub username this access was granted to
        invitee_user_id:
          type:
            - string
            - "null"
          description: |
            User ID of the collaborator, once resolved.

            Set immediately for collaborators who already are CEOS-ARD users,
            or on redeeming a share. Null while `status` is "pending"
            (the GitHub account has not logged in yet).
          default: null
        invited_by_user_id:
          type: string
          description: User ID of the workspace owner who added this collaborator
        created_at:
          type: string
          format: date-time
          description: When the collaborator was added
        accepted_at:
          type:
            - string
            - "null"
          format: date-time
          description: When the access became active (immediately, or upon the invitee's first login if it started "pending")
          default: null
        revoked_at:
          type:
            - string
            - "null"
          format: date-time
          description: When the owner revoked this access, if applicable
          default: null

    CollaboratorCreateRequest:
      type: object
      description: |
        Grant one or more GitHub users access to a workspace. Access takes
        effect immediately (or automatically upon the invitee's next login,
        if they haven't onboarded yet). Each username is resolved to its
        GitHub account id at creation and the access is bound to that id, so
        a later rename of the username neither breaks nor transfers it.
      required:
        - github_usernames
        - mode
      properties:
        github_usernames:
          type: array
          minItems: 1
          items:
            type: string
          description: GitHub usernames to grant access to
        mode:
          $ref: '#/components/schemas/AccessMode'

    CollaboratorUpdateRequest:
      type: object
      required:
        - mode
      properties:
        mode:
          $ref: '#/components/schemas/AccessMode'

    Share:
      type: object
      description: |
        A mode-bound, invitee-agnostic share of a workspace, opened through its link.
        The mode is resolved live from this record on every use, not baked
        into the token, so it can be changed without reissuing the share.
      required:
        - id
        - workspace_id
        - mode
        - created_by_user_id
        - created_at
        - url
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier of the share
        workspace_id:
          type: string
          format: uuid
          description: ID of the workspace this share grants access to
        mode:
          $ref: '#/components/schemas/AccessMode'
        url:
          type: string
          format: uri
          description: The full shareable URL (`{clientUrl}/share/{token}`)
        created_by_user_id:
          type: string
          description: User ID of the workspace owner who created the share
        created_at:
          type: string
          format: date-time
        expires_at:
          type:
            - string
            - "null"
          format: date-time
          description: Optional expiry. Null means the share does not expire.
          default: null

    ShareCreateRequest:
      type: object
      required:
        - mode
      properties:
        mode:
          $ref: '#/components/schemas/AccessMode'
        expires_at:
          type:
            - string
            - "null"
          format: date-time
          description: Optional expiry. Omit or set null for a share that does not expire.

    ShareUpdateRequest:
      type: object
      description: All fields optional; only supplied fields are changed.
      properties:
        mode:
          $ref: '#/components/schemas/AccessMode'
        expires_at:
          type:
            - string
            - "null"
          format: date-time

    SharePreview:
      type: object
      description: |
        Public, unauthenticated preview of a share. Contains no
        sensitive workspace data - used by the client to render the share
        landing page and decide whether to prompt login or onboarding
        before the share can be redeemed.
      required:
        - workspace_title
        - owner_display_name
        - mode
      properties:
        workspace_title:
          type: string
          description: Title of the shared workspace
        owner_display_name:
          type: string
          description: Display name of the workspace owner
        mode:
          $ref: '#/components/schemas/AccessMode'

    RedeemResponse:
      type: object
      required:
        - collaborator
        - workspace
      properties:
        collaborator:
          oneOf:
            - $ref: '#/components/schemas/Collaborator'
            - type: "null"
          description: Null when the requester is the workspace owner, who needs no collaborator entry.
        workspace:
          $ref: '#/components/schemas/Workspace'
