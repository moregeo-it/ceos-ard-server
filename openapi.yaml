openapi: 3.1.0
info:
  title: CEOS ARD Editor API
  version: 0.1.0
  description: |
    RESTful API for the CEOS ARD Editor application that provides workspace management,
    file editing, building block management, and GitHub integration capabilities.
  contact:
    name: CEOS ARD Team
    url: https://github.com/ceos-org/ceos-ard-editor
  license:
    name: Apache-2.0
    url: https://github.com/ceos-org/ceos-ard-editor/blob/main/LICENSE

servers:
  - url: http://localhost:8000
    description: Development server
  - url: https://ceos-ard-editor.example.com/api
    description: Production server

security:
  - bearerAuth: []


tags:
  - name: Authentication
    description: User authentication and session management
  - name: Workspaces
    description: Workspace CRUD operations and management
  - name: Events
    description: Real-time workspace change notifications delivered over Server-Sent Events (SSE)
  - name: Files
    description: File and building block operations
  - name: Previews
    description: Preview generation and management
  - name: PFS
    description: Product Family Specification management
  - name: Sharing
    description: Workspace sharing, collaborator management, and invitations

paths:
  /pfs:
    get:
      summary: List available PFS types
      description: Retrieves all available PFS types for CEOS-ARD (as available on the main branch of the ceos-ard repository)
      operationId: listPFSTypes
      tags:
        - PFS
      responses:
        '200':
          description: Available PFS types
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/pfsTypes'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/login:
    get:
      summary: Initiate GitHub login
      description: Redirects to GitHub for authentication
      operationId: initiateLogin
      tags:
        - Authentication
      security: []
      responses:
        '302':
          description: Redirect to GitHub authentication
          headers:
            Location:
              description: GitHub authentication URL
              schema:
                type: string
                format: uri
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/callback:
    get:
      summary: GitHub OAuth callback
      description: Handles GitHub OAuth callback and returns JWT token
      operationId: authCallback
      tags:
        - Authentication
      security: []
      parameters:
        - name: code
          in: query
          required: true
          description: Authorization code from GitHub
          schema:
            type: string
        - name: state
          in: query
          required: true
          description: State parameter for CSRF protection
          schema:
            type: string
      responses:
        '200':
          description: Successful authentication
          content:
            application/json:
              schema:
                type: object
                required:
                  - accessToken
                  - refreshToken
                  - expiresIn
                  - user
                properties:
                  accessToken:
                    type: string
                    description: JWT access token
                  refreshToken:
                    type: string
                    description: Refresh token for token renewal
                  expiresIn:
                    type: integer
                    description: Token expiration time in seconds
                  user:
                    $ref: '#/components/schemas/User'
        '400':
          description: Invalid request parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/logout:
    get:
      summary: Logout user
      description: Invalidates current session and tokens
      operationId: logout
      tags:
        - Authentication
      responses:
        '302':
          description: Successfully logged out
          headers:
            Location:
              description: Redirect URL after logout
              schema:
                type: string
                format: uri
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/user:
    get:
      summary: Get current user information
      description: Returns current authenticated user's information
      operationId: getCurrentUser
      tags:
        - Authentication
      responses:
        '200':
          description: User information retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /workspaces:
    get:
      summary: List all workspaces
      description: |
        Retrieves all workspaces the authenticated user has access to - both
        workspaces they own and workspaces shared with them ("Shared with
        me"). Each workspace's `viewer_role` field indicates whether the
        caller owns it ("owner") or the mode of their share ("readonly"),
        while `user_id`, `owner_username`, and `owner_full_name` identify the
        workspace owner.
      operationId: listWorkspaces
      tags:
        - Workspaces
      responses:
        '200':
          description: List of workspaces
          content:
            application/json:
              schema:
                type: object
                properties:
                  workspaces:
                    type: array
                    items:
                      $ref: '#/components/schemas/Workspace'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      summary: Create new workspace
      description: Creates a new workspace with cloned repository
      operationId: createWorkspace
      tags:
        - Workspaces
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
              properties:
                title:
                  type: string
                  description: Workspace title
                  minLength: 1
                  maxLength: 100
                description:
                  type: string
                  description: Workspace description
                pfs:
                  $ref: '#/components/schemas/pfs'
      responses:
        '201':
          description: Workspace created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
        '400':
          description: Invalid request data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /workspaces/{workspaceId}:
    get:
      summary: Get workspace details
      description: Retrieves detailed information about a specific workspace
      operationId: getWorkspace
      tags:
        - Workspaces
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      responses:
        '200':
          description: Workspace details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
        '404':
          description: Workspace not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    patch:
      summary: Update workspace
      description: |
        Updates workspace information including title, description, PFS, and status.

        **Archiving behavior:**
        - Setting status to "archived" will set archived_at to current time and deletion_at to 1 month later
        - Workspace files remain on disk during the 1-month retention period
        - Archived workspaces are automatically deleted after deletion_at date

        **Reactivation behavior:**
        - Setting status to "active" on an archived workspace will clear archived_at and deletion_at
        - Reactivation is only allowed if the pull request status is not "merged" or "closed"
        - Returns 400 error if attempting to reactivate a workspace with merged/closed PR
      operationId: updateWorkspace
      tags:
        - Workspaces
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  description: Workspace title
                description:
                  type: string
                  description: Workspace description
                pfs:
                  $ref: '#/components/schemas/pfs'
                status:
                  type: string
                  enum:
                    - active
                    - archived
                  description: |
                    Workspace status.

                    - Set to "archived" to archive the workspace (sets archived_at and deletion_at)
                    - Set to "active" to reactivate an archived workspace (clears archived_at and deletion_at)
                    - Reactivation only allowed if PR status is not "merged" or "closed"
      responses:
        '200':
          description: Workspace updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
        '400':
          description: |
            Invalid request data or business rule violation.

            Possible errors:
            - Cannot reactivate workspace with merged or closed pull request
            - At least one of description, title, or status must be provided
            - Invalid workspace status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                cannotReactivate:
                  summary: Cannot reactivate merged/closed workspace
                  value:
                    detail: Cannot reactivate an archived workspace with a merged or closed pull request
        '404':
          description: Workspace not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      summary: Delete workspace permanently
      description: |
        Permanently deletes a workspace immediately.

        **Warning:** This action is irreversible.
        - Workspace files are immediately deleted from disk
        - Database record is immediately deleted
        - No recovery possible

        **Note:** To archive a workspace with a 1-month grace period, use PATCH with status="archived" instead.
      operationId: deleteWorkspace
      tags:
        - Workspaces
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      responses:
        '204':
          description: Workspace deleted successfully
        '404':
          description: Workspace not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden - user not authorized to delete this workspace
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /workspaces/{workspaceId}/events:
    get:
      summary: Subscribe to real-time workspace change events (SSE)
      description: |
        Server-Sent Events stream of file/workspace changes, for any user
        with access to the workspace (owner or a readonly collaborator).
      operationId: subscribeWorkspaceEvents
      tags:
        - Events
      security:
        - bearerAuth: []
        - bearerQueryAuth: []
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - name: authorization
          in: query
          required: false
          description: JWT, for clients (e.g. `EventSource`) that can't send an `Authorization` header. Ignored if that header is present.
          schema:
            type: string
      responses:
        '200':
          description: SSE stream opened; stays open until the client disconnects or the server closes it (see above).
          headers:
            Cache-Control:
              description: Always `no-store` - the stream must not be cached.
              schema:
                type: string
                example: no-store
            X-Accel-Buffering:
              description: Always `no` - disables reverse-proxy response buffering so events flush immediately.
              schema:
                type: string
                example: "no"
          content:
            text/event-stream:
              schema:
                type: string
                description: Raw SSE frame stream (see the operation description and `WorkspaceEvent`).
              examples:
                fileSaved:
                  summary: A collaborator saved a file
                  value: |
                    event: file.saved
                    id: 42
                    data: {"type":"file.saved","actor_user_id":"3f8b1e1a-2b3c-4d5e-9f6a-7b8c9d0e1f2a","path":"/glossary/ups.yaml","file":{"name":"ups.yaml","path":"/glossary/ups.yaml","is_directory":false,"status":"modified"},"seq":42,"ts":"2026-07-14T12:00:00.000000+00:00"}

                shareRevoked:
                  summary: This subscriber's access was revoked (closes the stream)
                  value: |
                    event: share.revoked
                    id: 57
                    data: {"type":"share.revoked","actor_user_id":"3f8b1e1a-2b3c-4d5e-9f6a-7b8c9d0e1f2a","path":null,"file":null,"target_user_id":"9c6d2f3b-4a5e-4b6c-8d7e-1f2a3b4c5d6e","seq":57,"ts":"2026-07-14T12:05:30.000000+00:00"}

        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Workspace not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /workspaces/{workspaceId}/files:
    get:
      summary: List files in workspace
      description: |-
        Retrieves files and folders in the workspace.

        Doesn't list the following files / folders:
        - Files/folders starting with a dot (.)

        Additionalls, doesn't list the following Files/folders at the root:
        - templates
        - build
      operationId: listFiles
      tags:
        - Files
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - name: path
          in: query
          description: Directory path to list (defaults to root)
          schema:
            type: string
            default: "/"
        - name: recurse
          in: query
          description: Whether to list files recursively
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: List of files and folders
          content:
            application/json:
              schema:
                type: object
                properties:
                  files:
                    type: array
                    items:
                      $ref: '#/components/schemas/FileItem'
        '404':
          description: Workspace not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      summary: Create new empty file or folder
      description: Creates a new empty file or folder in the workspace
      operationId: createFileOrFolder
      tags:
        - Files
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: File or folder name
                  minLength: 1
                path:
                  type: string
                  description: Directory path where to create the file/folder
                type:
                  type: string
                  enum:
                    - file
                    - folder
                  description: Type of item to create
              required:
                - name
                - path
                - type
      responses:
        '201':
          description: File created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileItem'
        '400':
          description: Invalid request data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Workspace not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden - readonly collaborators cannot create files or folders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /workspaces/{workspaceId}/files/{filePath}:
    get:
      summary: Get file content
      description: |-
        Retrieves the content of a specific file.

        The endoint shall only return files that are made available through
        `GET /workspaces/{workspaceId}/files`. Other files, e.g. withing `.git`
        should not be accessible and return a 404 error.
      operationId: getFileContent
      tags:
        - Files
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/FilePath'
      responses:
        '200':
          description: File content
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '404':
          description: File not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    put:
      summary: Upload file content
      description: |-
        Uploads the content of a specific file.

        Validation may take place, e.g. validating against the strictyaml schemas of the corresponding YAML files.
        File should be stored as is without parsing, e.g. comments in YAML files should be preserved.

        The endoint shall only handle files that are made available through
        `GET /workspaces/{workspaceId}/files`. Other files, e.g. withing `.git`
        should not be changed and return a 404 error.
      operationId: uploadFileContent
      tags:
        - Files
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/FilePath'
      requestBody:
        required: true
        content:
          '*/*':
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: File updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileItem'
        '400':
          description: Invalid request data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: File not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden - readonly collaborators cannot upload file content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      summary: Delete file
      description: |-
        Deletes a specific file.

        The endoint shall only handle files that are made available through
        `GET /workspaces/{workspaceId}/files`. Other files, e.g. withing `.git`
        should not be deleted and return a 404 error.
      operationId: deleteFile
      tags:
        - Files
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/FilePath'
      responses:
        '200':
          description: |-
            A tracked file has been deleted, it could be reverted.
            The file information is returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileItem'
        '204':
          description: |-
            An untracked file has been deleted permanently, it can't be restored.
            No file information is returned.
        '404':
          description: File not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden - readonly collaborators cannot delete files or folders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    patch:
      summary: Update file metadata or operations
      description: |-
        Performs file operations such as rename or revert.

        The endoint shall only handle files that are made available through
        `GET /workspaces/{workspaceId}/files`. Other files, e.g. withing `.git`
        should not be changed and return a 404 error.
      operationId: patchFile
      tags:
        - Files
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/FilePath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                operation:
                  type: string
                  enum:
                    - rename
                    - revert
                  description: The operation to perform on the file
              required:
                - operation
              oneOf:
                - properties:
                    operation:
                      const: rename
                    target:
                      description: New name for the file
                      type: string
                  required:
                    - target
                - properties:
                    operation:
                      const: revert
      responses:
        '200':
          description: |-
            File operation completed successfully.
            The updated file information is returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileItem'
        '400':
          description: Invalid request data or operation conflicts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: File not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden - readonly collaborators cannot rename or revert files
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /workspaces/{workspaceId}/search:
    get:
      summary: Search files in workspace
      description: Searches through all files in the workspace
      operationId: searchFiles
      tags:
        - Workspaces
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - name: query
          in: query
          required: true
          description: Search query
          schema:
            type: string
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      required:
                        - name
                        - path
                        - type
                      properties:
                        name:
                          type: string
                          description: Name to the file containing the match
                        path:
                          type: string
                          description: Absolute path to the file starting from the workspace root
                        type:
                          type: string
                          description: Where the match was found
                          enum:
                            - filename
                            - content
                      oneOf:
                        - type: object
                          properties:
                            type:
                              const: filename
                        - type: object
                          required:
                            - line
                            - column
                            - excerpt
                          properties:
                            type:
                              const: content
                            line:
                              type: integer
                              description: Line number of the match
                            column:
                              type: integer
                              description: Column number of the match
                            excerpt:
                              type: string
                              description: Text excerpt around the match
        '400':
          description: Invalid search query
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Workspace not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /workspaces/{workspaceId}/diffs:
    get:
      summary: Get list of changed files
      description: |
        Retrieves a list of files that are not unchanged (including added, deleted, modified, etc.) according to git.

        Surfaced exclusively in the Propose view - owner only, even for collaborators with "edit" access.
      operationId: getChangedFiles
      tags:
        - Files
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      responses:
        '200':
          description: List of changed files
          content:
            application/json:
              schema:
                type: object
                properties:
                  files:
                    type: array
                    items:
                      type: object
                      required:
                        - path
                        - status
                      properties:
                        path:
                          type: string
                          description: Absolute path to the file starting from the workspace root
                        status:
                          type: string
                          enum:
                            - A
                            - M
                            - D
                            - R
                          description: |-
                            Status of the file

                            - A=Added
                            - M=Modified
                            - D=Deleted
                            - R=Renamed
                      if:
                        properties:
                          status:
                            const: R
                      then:
                        required:
                          - source
                        properties:
                          source:
                            type: string
                            description: Old path (for renamed files)
        '404':
          description: Workspace not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden - only the workspace owner can view the changed-files list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    put:
      summary: Create a commit of the changes
      description: |
        Creates a new git commit for all current workspace changes.

        Owner only, even for collaborators with "edit" access - only the
        owner's GitHub credentials can push to the workspace's fork.
        Collaborators' staged changes are committed and pushed by the owner.
      operationId: commitChanges
      tags:
        - Files
        - Workspaces
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Create a git commit
              required:
                - message
              properties:
                message:
                  $ref: '#/components/schemas/CommitMessage'
      responses:
        '200':
          description: Commit created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Commit'
        '400':
          description: Invalid request data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Workspace not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden - only the workspace owner can commit changes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /workspaces/{workspaceId}/diffs/{filePath}:
    get:
      summary: Get diff for specific file
      description: |-
        Retrieves the git diff for a specific file, if available.

        The endoint shall only return files that are made available through
        `GET /workspaces/{workspaceId}/files`. Other files, e.g. withing `.git`
        should not be accessible and return a 404 error.
      operationId: getFileDiff
      tags:
        - Files
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/FilePath'
      responses:
        '200':
          description: File diff information
          content:
            text/plain:
              schema:
                type: string
                description: |-
                  Diff content in unified diff format.
                  Might be empty if there are no changes.
                example: |-
                  diff --git a/glossary/ups.yaml b/glossary/ups.yaml
                  index fafae97..e231b87 100644
                  --- a/glossary/ups.yaml
                  +++ b/glossary/ups.yaml
                  @@ -1,2 +1,2 @@
                  term: UPS
                  -description: Universal Polar Stereographic
                  \ No newline at end of file
                  +description: United Parcel Service
                  \ No newline at end of file
        '404':
          description: Workspace or file not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /workspaces/{workspaceId}/context/{filePath}:
    get:
      summary: Get additional contextual information for specific file
      description: |-
        Retrieves the context for a specific file, if available.

        This is currently a list of PFS that use the specified file.

        The endoint shall only return files that are made available through
        `GET /workspaces/{workspaceId}/files`. Other files, e.g. withing `.git`
        should not be accessible and return a 404 error.
      operationId: getFileContext
      tags:
        - Files
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/FilePath'
      responses:
        '200':
          description: Contextual information retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/FileItem'
                  - type: object
                    required:
                      - usage
                    properties:
                      usage:
                        description: |-
                          List of PFS IDs that use the specified file.

                          Returns an empty array if the file is not used by any PFS.
                          Returns `null` if the information is not available / unknown.
                        type:
                          - array
                          - 'null'
                        items:
                          type: string
                          description: PFS ID that uses the specified file
        '404':
          description: Workspace or file not found, or no diff available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /workspaces/{workspaceId}/previews:
    get:
      summary: Generate preview
      description: Generates preview for the current workspace state
      operationId: generatePreview
      tags:
        - Previews
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/PfsType'
      responses:
        '200':
          description: Preview generated successfully
          content:
            text/html:
              schema:
                type: string
                description: HTML content of the preview
        '202':
          description: Preview generation in progress
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Preview generation started"
        '404':
          description: Workspace not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /workspaces/{workspaceId}/previews/{filePath}:
    get:
      summary: Return static assets for the preview
      description: Returns static assets for the preview of the current workspace state
      operationId: getPreviewAsset
      tags:
        - Previews
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/FilePath'
        - $ref: '#/components/parameters/PfsType'
      responses:
        '200':
          description: File content
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '404':
          description: File not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /workspaces/{workspaceId}/download:
    get:
      summary: Download preview document
      description: Downloads the preview document for the current workspace state
      operationId: downloadPreviewDocument
      tags:
        - Previews
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/PfsType'
        - $ref: '#/components/parameters/DocumentFormat'
      responses:
        '200':
          description: Preview document content downloaded successfully
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            application/vnd.openxmlformats-officedocument.wordprocessingml.document:
              schema:
                type: string
                format: binary
        '404':
          description: Workspace not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /workspaces/{workspaceId}/proposal:
    get:
      summary: Get proposal information
      description: |
        Retrieves information about the proposal (GitHub Pull Request) for the workspace changes.

        This endpoint returns the current state of the PR including title, description, draft status,
        and whether the PR has been closed or merged.

        Owner only - the Propose view (and this data) is not exposed to collaborators at all,
        even in read-only form.
      operationId: getProposal
      tags:
        - Workspaces
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      responses:
        '200':
          description: Proposal information retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Proposal'
        '204':
          description: No proposal exists for the workspace
        '404':
          description: Workspace not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden - only the workspace owner can view the proposal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    put:
      summary: Create or update proposal
      description: |
        Creates a new proposal (GitHub Pull Request) or updates an existing one for the workspace changes.

        **Creating a new proposal:**

        - Opens a new GitHub PR with the provided title and description
        - The PR is marked as draft by default

        **Updating an existing proposal:**

        - Updates the PR title and/or description
        - The draft/ready status can be changed (due to current limitations in the GitHub REST API)
        - Could potentially close or reopen the PR
      operationId: createOrUpdateProposal
      tags:
        - Workspaces
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Input for creating or updating a proposal
              required:
                - title
                - description
              properties:
                title:
                  $ref: '#/components/schemas/ProposalTitle'
                description:
                  $ref: '#/components/schemas/ProposalDescription'
                state:
                  type: string
                  enum:
                    - open
                    - closed
                  description: |
                    Desired state of the PR.

                    - "open": PR should be open and can receive commits/updates
                    - "closed": PR should be closed without merging (withdrawn)

                    If a PR can't be opened or closed (e.g. because missing permissions or being merged),
                    a 409 Conflict error will be returned.
      responses:
        '200':
          description: Proposal created/updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Proposal'
        '400':
          description: Invalid request data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Workspace not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflict with existing state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden - only the workspace owner can propose changes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /workspaces/{workspaceId}/commits:
    get:
      summary: List workspace commits
      description: |
        Retrieves the list of git commits in the workspace.

        Owner only - surfaced exclusively in the Propose view, which is not exposed to collaborators.
      operationId: listWorkspaceCommits
      tags:
        - Workspaces
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      responses:
        '200':
          description: List of commits
          content:
            application/json:
              schema:
                type: object
                properties:
                  commits:
                    type: array
                    items:
                      $ref: '#/components/schemas/Commit'
        '404':
          description: Workspace not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden - only the workspace owner can view commits
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /workspaces/{workspaceId}/pfs:
    get:
      summary: List available PFS types
      description: Retrieves all available PFS types for the workspace
      operationId: listWorkspacePFSTypes
      tags:
        - PFS
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      responses:
        '200':
          description: Available PFS types
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/pfsTypes'
        '404':
          description: Workspace not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      summary: Create new PFS
      description: >-
        Creates a new PFS based on an existing one.

        Validation may take place, e.g. validating against the strictyaml schemas of the corresponding YAML files.
      operationId: createPFS
      tags:
        - PFS
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - id
                - title
              properties:
                base:
                  type:
                    - string
                    - "null"
                  description: Existing PFS to base the new one on
                  default: null
                id:
                  type: string
                  description: ID for the new PFS
                title:
                  type: string
                  description: Title for the new PFS
                version:
                  type: string
                  description: Version of the new PFS
                  default: "1.0.0-draft"
                type:
                  type: string
                  description: Type of the new PFS
                  enum:
                    - Optical
                    - SAR
                applies_to:
                  type: string
                  description: Description of the new PFS
                introduction:
                  type: array
                  items:
                    type: string
                  default:
                    - what-are-ceos-ard-products
                    - when-is-a-product-ceos-ard
                    - difference-threshold-goal
      responses:
        '201':
          description: PFS created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileItem'
        '400':
          description: Invalid request data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Workspace not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /workspaces/{workspaceId}/shares:
    get:
      summary: List all shares for a workspace
      description: |
        Retrieves everyone with access to the workspace - both direct grants
        and users who joined via a share link - along with their mode and
        status. Owner only.
      operationId: listWorkspaceShares
      tags:
        - Sharing
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      responses:
        '200':
          description: List of workspace shares
          content:
            application/json:
              schema:
                type: object
                properties:
                  shares:
                    type: array
                    items:
                      $ref: '#/components/schemas/WorkspaceShare'
        '404':
          description: Workspace not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden - only the workspace owner can view shares
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      summary: Share a workspace with specific people
      description: |
        Grants one or more GitHub users access to the workspace at the given
        mode. Owner only.

        - If a given username already belongs to an onboarded CEOS-ARD user,
          that person has access right away; it appears next time they view
          their workspaces ("Shared with me").
        - If a given username hasn't onboarded yet, the grant is recorded as
          `pending` and activates automatically the moment that person signs
          in with GitHub for the first time.
        - Re-sharing to a username that already has a share on this
          workspace updates the existing share's mode (and reactivates it if
          it was previously `revoked`) rather than creating a duplicate.
      operationId: createWorkspaceShares
      tags:
        - Sharing
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShareCreateRequest'
      responses:
        '201':
          description: Shares created or updated successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  shares:
                    type: array
                    items:
                      $ref: '#/components/schemas/WorkspaceShare'
        '400':
          description: |
            Invalid request data.

            Possible errors:
            - `githubUsernames` empty or missing
            - Invalid mode
            - Owner's own username included in `githubUsernames`
            - One or more `githubUsernames` do not correspond to a real GitHub user (validated
              against the GitHub API; the response names exactly which ones failed). This check
              runs before any shares are created - the whole request is rejected atomically if
              any username is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Workspace not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden - only the workspace owner can share it
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /workspaces/{workspaceId}/shares/{shareId}:
    patch:
      summary: Change a collaborator's access mode
      description: Updates the mode (readonly) of an existing share. Owner only.
      operationId: updateWorkspaceShare
      tags:
        - Sharing
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/ShareId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShareUpdateRequest'
      responses:
        '200':
          description: Share updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceShare'
        '404':
          description: Workspace or share not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden - only the workspace owner can manage shares
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      summary: Revoke a collaborator's access
      description: |
        Revokes a person's access to the workspace, direct share or share link.
        Takes effect immediately on their next request. Revocation is sticky:
        if they still hold a share link for this workspace, re-opening it will
        not restore access - the owner must explicitly re-share. Owner only.
      operationId: revokeWorkspaceShare
      tags:
        - Sharing
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/ShareId'
      responses:
        '204':
          description: Share revoked successfully
        '404':
          description: Workspace or share not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden - only the workspace owner can manage shares
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /workspaces/{workspaceId}/share-links:
    get:
      summary: List share links for a workspace
      description: Retrieves all share links (active and inactive) for a workspace. Owner only.
      operationId: listWorkspaceShareLinks
      tags:
        - Sharing
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      responses:
        '200':
          description: List of share links
          content:
            application/json:
              schema:
                type: object
                properties:
                  shareLinks:
                    type: array
                    items:
                      $ref: '#/components/schemas/WorkspaceShareLink'
        '404':
          description: Workspace not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden - only the workspace owner can view share links
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      summary: Create a share link
      description: |
        Generates a signed, mode-bound share link for the workspace. Anyone
        who opens the link is granted access with this mode once they're
        authenticated.

        The link's mode and active state are looked up on every use, so the
        owner can change the mode without needing to reissue a new
        URL. Deactivating a link is reversible - the same URL works again
        once `isActive` is set back to `true`. Deleting a link is permanent,
        so restoring access means creating a brand-new link.
        Changing an active link's mode does not retroactively change the mode
        already granted to people who joined earlier through it.
      operationId: createWorkspaceShareLink
      tags:
        - Sharing
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShareLinkCreateRequest'
      responses:
        '201':
          description: Share link created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceShareLink'
        '400':
          description: Invalid mode or expiresAt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Workspace not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden - only the workspace owner can create share links
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /workspaces/{workspaceId}/share-links/{linkId}:
    patch:
      summary: Update a share link
      description: |
        Changes a share link's mode, active state, and/or expiry. Owner only.
        Setting `isActive: false` immediately stops the link from granting
        new access (existing collaborators who already joined through it are
        unaffected - revoke them individually via
        `DELETE /workspaces/{workspaceId}/shares/{shareId}` if needed).
      operationId: updateWorkspaceShareLink
      tags:
        - Sharing
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/ShareLinkId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShareLinkUpdateRequest'
      responses:
        '200':
          description: Share link updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceShareLink'
        '404':
          description: Workspace or share link not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden - only the workspace owner can manage share links
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      summary: Delete a share link
      description: |
        Permanently deletes a share link. The URL stops working immediately
        and is not reversible - sharing again means creating a new link,
        which produces a new URL. Owner only.
      operationId: deleteWorkspaceShareLink
      tags:
        - Sharing
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/ShareLinkId'
      responses:
        '204':
          description: Share link deleted successfully
        '404':
          description: Workspace or share link not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden - only the workspace owner can manage share links
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /share-links/{token}/redeem:
    post:
      summary: Redeem a share link
      description: |
        Grants the currently authenticated user access to the shared
        workspace with the appropriate mode.
      operationId: redeemShareLink
      tags:
        - Sharing
      security:
        - bearerAuth: []
        - {}
      parameters:
        - $ref: '#/components/parameters/ShareLinkToken'
      responses:
        '200':
          description: Access granted (or already held); returns the resulting share and workspace
          content:
            application/json:
              schema:
                type: object
                required:
                  - share
                  - workspace
                properties:
                  share:
                    oneOf:
                      - $ref: '#/components/schemas/WorkspaceShare'
                      - type: "null"
                    description: |
                      Null when the requester is the workspace owner (they
                      already have full access; no share row is created).
                  workspace:
                    $ref: '#/components/schemas/Workspace'
        '401':
          description: |
            Not authenticated yet. Body is a share link preview, not a
            generic error - use it to render context before redirecting to
            login/onboarding, then call this same endpoint again afterward.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShareLinkPreview'
        '403':
          description: This user's access to the workspace was previously revoked by the owner
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Invalid, inactive, expired, or deleted share link
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token obtained from authentication endpoint
    bearerQueryAuth:
      type: apiKey
      in: query
      name: authorization
      description: Same JWT as `bearerAuth`, as a query param. Used by `GET /workspaces/{workspaceId}/events`, whose `EventSource` clients can't set headers.

  parameters:
    WorkspaceId:
      name: workspaceId
      in: path
      required: true
      description: Unique identifier of the workspace
      schema:
        type: string
        format: uuid

    FilePath:
      name: filePath
      in: path
      required: true
      description: Path to the file
      schema:
        type: string

    PfsType:
      name: pfs
      in: query
      style: form
      explode: true
      description: |-
        PFS type for preview generation.

        If not provided, uses the default PFS type(s) that have been selected during workspace creation.
      schema:
        type: array
        items:
          type: string

    DocumentFormat:
      name: format
      in: query
      required: true
      description: Format of the downloaded preview document.
      schema:
        type: string
        enum:
          - pdf
          - docx

    ShareId:
      name: shareId
      in: path
      required: true
      description: Unique identifier of the workspace share
      schema:
        type: string
        format: uuid

    ShareLinkId:
      name: linkId
      in: path
      required: true
      description: Unique identifier of the share link
      schema:
        type: string
        format: uuid

    ShareLinkToken:
      name: token
      in: path
      required: true
      description: |
        Signed, mode-bound share link token from `{clientUrl}/share/{token}`.
        Invitee-agnostic - not tied to any specific identity, and not a
        session/JWT access token. Grants no access by itself; only
        `POST /share-links/{token}/redeem` (as an authenticated user) does.
      schema:
        type: string

  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
          description: Error message
        code:
          type: string
          description: Error code
      required:
        - error
        - code

    User:
      type: object
      required:
        - id
        - username
        - displayName
        - email
        - avatar
      properties:
        id:
          type: string
          description: User ID
        username:
          type: string
          description: GitHub username
        displayName:
          type: string
          description: User's display name
        email:
          type: string
          format: email
          description: User's email address
        avatar:
          type: string
          format: uri
          description: URL to user's avatar image

    ProposalTitle:
      type: string
      description: Title of the proposal (GitHub Pull Request)
      minLength: 1
      maxLength: 200
    ProposalDescription:
      type:
        - string
        - "null"
      description: Description/body of the proposal (GitHub Pull Request) (supports Markdown)
      minLength: 1
      maxLength: 10000
    CommitMessage:
      type: string
      description: Commit message
      minLength: 1
      maxLength: 500
    ProposalDraft:
      type: boolean
      description: |
        Whether the proposal (GitHub Pull Request) is marked as a draft.

        - true: PR is a draft and not ready for review
        - false: PR is ready for review

        If a proposal exists, the default is taken from the existing PR state.
        If no proposal exists, the default is `true` (draft).
      default: true

    Proposal:
      type: object
      description: |
        Represents a proposal (GitHub Pull Request) for workspace changes.
        Users should poll this resource to stay informed about changes to the PR status.
      required:
        - number
        - url
        - title
        - description
        - state
        - draft
      properties:
        number:
          type: integer
          description: GitHub PR number
        url:
          type: string
          format: uri
          description: URL to the GitHub PR
        title:
          $ref: '#/components/schemas/ProposalTitle'
        description:
          $ref: '#/components/schemas/ProposalDescription'
        state:
          type: string
          enum:
            - open
            - closed
            - merged
          description: |
            Current state of the PR.

            - "open": PR is open and can receive commits/updates
            - "closed": PR was closed without merging (withdrawn)
            - "merged": PR was merged into the main branch
        draft:
          $ref: '#/components/schemas/ProposalDraft'

    Commit:
      type: object
      required:
        - sha
        - message
        - timestamp
        - author
      properties:
        sha:
          type: string
          description: Commit SHA
        message:
          $ref: '#/components/schemas/CommitMessage'
        timestamp:
          type: string
          format: date-time
          description: Commit timestamp
        author:
          type: string
          description: Name of the commit author

    Workspace:
      type: object
      required:
        - id
        - name
        - description
        - repository
        - branch
        - pfs
        - created
        - pr
        - user_id
      properties:
        id:
          type: string
          format: uuid
          description: Unique workspace identifier
        title:
          type: string
          description: Workspace title
        description:
          type: string
          description: Workspace description
        repository:
          type: string
          format: uri
          description: URL of the Git repository for the workspace
        branch:
          type: string
          description: Name of the branch in the repository
        pfs:
          $ref: '#/components/schemas/pfs'
        created:
          type: string
          format: date-time
          description: Workspace creation timestamp
        status:
          type: string
          enum:
            - active
            - archived
          description: |
            Workspace status.

            - "archived": Workspace has been archived (manually or due to merged/closed PR)
            - "active": Workspace is active and can be worked on
        archived_at:
          type:
            - string
            - "null"
          format: date-time
          description: |
            Timestamp when workspace was archived.

            Set automatically when status changes to "archived".
            Cleared when workspace is reactivated.
          default: null
        deletion_at:
          type:
            - string
            - "null"
          format: date-time
          description: |
            Scheduled permanent deletion timestamp (computed as archived_at + 1 month).

            **Note**: This is a computed property, not stored in the database.
            After this time, workspace files and database record will be permanently deleted by cleanup script.
            Automatically null when workspace is not archived.
          default: null
          readOnly: true
        pr:
          type:
            - string
            - "null"
          description: ID to the GitHub PR
          default: null
        pr_status:
          type:
            - string
            - "null"
          enum:
            - unknown
            - open
            - approved
            - closed
            - merged
            - null
          description: Status of the PR
          default: null
        user_id:
          type: string
          description: The user ID of the workspace owner
        owner_username:
          type:
            - string
            - "null"
          description: GitHub username of the workspace owner
          default: null
        owner_full_name:
          type:
            - string
            - "null"
          description: Full name of the workspace owner
          default: null
        viewer_role:
          type: string
          enum:
            - owner
            - readonly
          readOnly: true
          description: |
            The current authenticated user's effective role on this workspace.

            Computed per-request; not stored. Always "owner" for the workspace
            creator. For collaborators, reflects their accepted share mode,
            clamped to "readonly" while the workspace is archived.

    WorkspaceEventType:
      type: string
      enum:
        - file.saved
        - file.created
        - file.deleted
        - file.renamed
        - file.reverted
        - file.committed
        - share.revoked
        - workspace.archived
        - workspace.deleted
      description: |
        Kind of `WorkspaceEvent` (also the SSE frame's `event:` field).

        - `file.saved`: file overwritten via `PUT .../files/{filePath}`.
        - `file.created`: file/folder created via `POST .../files` or a new PFS via `POST .../pfs`.
        - `file.deleted`: file/folder deleted via `DELETE .../files/{filePath}` (see `tracked`).
        - `file.renamed`/`file.reverted`: `PATCH .../files/{filePath}` with `operation: rename`/`revert`.
        - `file.committed`: changes committed via `PUT .../diffs`.
        - `share.revoked`: access revoked via `DELETE .../shares/{shareId}`; sent only to the target (see `target_user_id`) and closes their stream.
        - `workspace.archived`: workspace archived via `PATCH .../{workspaceId}`.
        - `workspace.deleted`: workspace deleted via `DELETE .../{workspaceId}`; closes the stream for everyone.

    WorkspaceEvent:
      type: object
      description: JSON payload in the `data:` line of each SSE frame. `type`/`seq` are mirrored in the frame's `event:`/`id:` fields.
      required:
        - type
        - seq
        - ts
        - actor_user_id
      properties:
        type:
          $ref: '#/components/schemas/WorkspaceEventType'
        seq:
          type: integer
          description: >-
            Opaque process-wide counter (mirrored in the frame's `id:`), for ordering/debug only.
        ts:
          type: string
          format: date-time
          description: Server timestamp when published.
        actor_user_id:
          type:
            - string
            - "null"
          description: User who caused the event, or `null` if system-generated. Clients typically ignore events they caused themselves.
        path:
          type:
            - string
            - "null"
          default: null
          description: Path of the affected file. `null` for events not scoped to a file.
        file:
          default: null
          description: Snapshot of the affected file/folder. `null` for events not scoped to a file.
          oneOf:
            - $ref: '#/components/schemas/FileItem'
            - type: "null"
        target_user_id:
          type: string
          description: Only on `share.revoked` - the user id this event is delivered to (never broadcast to other subscribers).
        tracked:
          type: boolean
          description: Only on `file.deleted` - whether the file was git-tracked (revertible) or untracked (removed permanently).

    FileItem:
      type: object
      required:
        - name
        - path
      properties:
        name:
          type: string
          description: File or folder name
        path:
          type: string
          description: Absolute path to the file/folder starting from the workspace root
        is_directory:
          type: boolean
          description: Whether the item is a Directory
          default: false
        status:
          type:
            - string
            - "null"
          enum:
            - added
            - modified
            - deleted
            - renamed
            - null
          default: null
          description: |-
            Status of the file

            - *null*=Unchanged
            - added=Added
            - modified=Modified
            - deleted=Deleted
            - renamed=Renamed

    pfs:
      description: List of PFS types assigned to the workspace, used for preview generation.
      type: array
      items:
        $ref: '#/components/schemas/pfsId'
      example:
        - NRB
        - POL

    pfsTypes:
      type: object
      required:
        - pfsTypes
      properties:
        pfsTypes:
          type: array
          items:
            type: object
            required:
              - id
            properties:
              id:
                $ref: '#/components/schemas/pfsId'
              title:
                type: string
                description: Human-readable title
            example:
              id: NRB
              title: SAR Normalised Radar Backscatter

    pfsId:
      type: string
      description: PFS type identifier
      pattern: ^[A-Z0-9][A-Z0-9-]*[A-Z0-9]$
      example: NRB

    ShareMode:
      type: string
      enum:
        - readonly
      description: |
        Access level granted to a collaborator.

        - "readonly": Can view the workspace and its files, cannot make
          changes. Equivalent to viewing an archived workspace.

    ShareStatus:
      type: string
      enum:
        - pending
        - accepted
        - revoked
      description: |
        Lifecycle status of a share.

        - "pending": Granted by GitHub username to someone who hasn't
          onboarded to CEOS-ARD yet. Resolves to "accepted" automatically
          the moment they first sign in with GitHub.
        - "accepted": Active access, either granted immediately (existing
          user, or via a redeemed share link) or auto-resolved from
          "pending".
        - "revoked": Owner removed access. Sticky: reusing a share link the
          person still holds does not restore it.

    WorkspaceShare:
      type: object
      description: |
        A single collaborator's access grant on a workspace, however it was
        created - a direct share by username, or a redeemed share link (see
        `shareLinkId`). There is no separate "invitation" object: this row
        *is* the grant, from the moment it's created.
      required:
        - id
        - workspaceId
        - mode
        - status
        - invitedGithubUsername
        - invitedBy
        - createdAt
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier of the share
        workspaceId:
          type: string
          format: uuid
          description: ID of the workspace this share belongs to
        shareLinkId:
          type:
            - string
            - "null"
          format: uuid
          description: |
            ID of the share link this grant was created through, if any.
            Null for shares created directly by username. Provenance only -
            does not affect permission evaluation.
          default: null
        mode:
          $ref: '#/components/schemas/ShareMode'
        status:
          $ref: '#/components/schemas/ShareStatus'
        invitedGithubUsername:
          type: string
          description: GitHub username this share was granted to
        invitedUserId:
          type:
            - string
            - "null"
          description: |
            User ID of the collaborator, once resolved.

            Set immediately for shares granted to an existing CEOS-ARD user,
            or on redeeming a share link. Null while `status` is "pending"
            (username not yet onboarded).
          default: null
        invitedBy:
          type: string
          description: User ID of the workspace owner who granted this share
        createdAt:
          type: string
          format: date-time
          description: When the share was created
        acceptedAt:
          type:
            - string
            - "null"
          format: date-time
          description: When the share became active (immediately, or upon the invitee's first login if it started "pending")
          default: null
        revokedAt:
          type:
            - string
            - "null"
          format: date-time
          description: When the owner revoked this share, if applicable
          default: null

    ShareCreateRequest:
      type: object
      description: |
        Grant one or more GitHub users access to a workspace. Access takes
        effect immediately (or automatically upon the invitee's next login,
        if they haven't onboarded yet).
      required:
        - githubUsernames
        - mode
      properties:
        githubUsernames:
          type: array
          minItems: 1
          items:
            type: string
          description: GitHub usernames to grant access to
        mode:
          $ref: '#/components/schemas/ShareMode'

    ShareUpdateRequest:
      type: object
      required:
        - mode
      properties:
        mode:
          $ref: '#/components/schemas/ShareMode'

    WorkspaceShareLink:
      type: object
      description: |
        A shareable, mode-bound, invitee-agnostic link for a workspace.
        Mode and active state are resolved live from this record on every
        use, not baked into the token, so they can be changed without
        reissuing the link.
      required:
        - id
        - workspaceId
        - mode
        - isActive
        - createdBy
        - createdAt
        - url
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier of the share link
        workspaceId:
          type: string
          format: uuid
          description: ID of the workspace this link grants access to
        mode:
          $ref: '#/components/schemas/ShareMode'
        isActive:
          type: boolean
          description: Whether this link currently grants access. Owner-toggleable.
        url:
          type: string
          format: uri
          description: The full shareable URL (`{clientUrl}/share/{token}`)
        createdBy:
          type: string
          description: User ID of the workspace owner who created the link
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type:
            - string
            - "null"
          format: date-time
          description: Optional expiry. Null means the link does not expire.
          default: null
        revokedAt:
          type:
            - string
            - "null"
          format: date-time
          default: null

    ShareLinkCreateRequest:
      type: object
      required:
        - mode
      properties:
        mode:
          $ref: '#/components/schemas/ShareMode'
        expiresAt:
          type:
            - string
            - "null"
          format: date-time
          description: Optional expiry. Omit or set null for a link that does not expire.

    ShareLinkUpdateRequest:
      type: object
      description: All fields optional; only supplied fields are changed.
      properties:
        mode:
          $ref: '#/components/schemas/ShareMode'
        isActive:
          type: boolean
        expiresAt:
          type:
            - string
            - "null"
          format: date-time

    ShareLinkPreview:
      type: object
      description: |
        Public, unauthenticated preview of a share link. Contains no
        sensitive workspace data - used by the client to render the share
        landing page and decide whether to prompt login or onboarding
        before the link can be redeemed.
      required:
        - workspaceTitle
        - ownerDisplayName
        - mode
        - isActive
      properties:
        workspaceTitle:
          type: string
          description: Title of the shared workspace
        ownerDisplayName:
          type: string
          description: Display name of the workspace owner
        mode:
          $ref: '#/components/schemas/ShareMode'
        isActive:
          type: boolean
          description: Whether this link currently grants access
