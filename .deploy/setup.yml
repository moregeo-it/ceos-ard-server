---
# Converges everything AROUND the code: PostgreSQL, service, timers, Caddy, TLS,
# data directories, backups, swap. It only clones the code on a new host and never
# moves an existing checkout, so running it cannot change which version is deployed.
#
# Dry run:  ansible-playbook setup.yml --check --diff
- name: Configure the CEOS-ARD server host
  hosts: ceos_ard_servers
  gather_facts: true
  roles:
    - ceos_ard_server
