---
- name: Check the deployed revision
  ansible.builtin.import_tasks: version.yml

- name: Install packages
  ansible.builtin.import_tasks: packages.yml
  tags: [packages]

- name: Provide swap
  ansible.builtin.import_tasks: swap.yml
  when: manage_swap
  tags: [swap]

- name: Allow isolated builds
  ansible.builtin.import_tasks: sandbox.yml
  tags: [sandbox]

- name: Create the data directories
  ansible.builtin.import_tasks: directories.yml
  tags: [directories]

- name: Write the application configuration
  ansible.builtin.import_tasks: config.yml
  tags: [config]

- name: Install and run the service
  ansible.builtin.import_tasks: service.yml
  tags: [service]

- name: Install the maintenance timers
  ansible.builtin.import_tasks: timers.yml
  tags: [timers]

- name: Install the backups
  ansible.builtin.import_tasks: backup.yml
  tags: [backup]

- name: Configure Caddy
  ansible.builtin.import_tasks: caddy.yml
  when: manage_caddy
  tags: [caddy]
