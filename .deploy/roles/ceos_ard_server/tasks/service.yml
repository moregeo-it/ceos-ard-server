- name: Install the systemd unit
  become: true
  ansible.builtin.template:
    src: app.service.j2
    dest: /etc/systemd/system/{{ app_name }}.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart app

- name: Flush handlers so the unit is current before enabling it
  ansible.builtin.meta: flush_handlers

- name: Enable the service
  become: true
  ansible.builtin.systemd_service:
    name: "{{ app_name }}"
    enabled: "{{ app_service_enabled }}"

- name: Start the service
  become: true
  ansible.builtin.systemd_service:
    name: "{{ app_name }}"
    state: started
  when: app_service_started
