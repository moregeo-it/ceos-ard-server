# The workspace types of this deployment. Copy to workspace-types.yaml, or set WORKSPACE_TYPES_CONFIG to its path.
# Without the file, the server offers CEOS-ARD with its defaults.
types:
  # The first offered type is the default
  - # Stored with every workspace, so it never changes
    id: ceos-ard
    # The module of app/workspace_types that implements the type
    module: ceos_ard
    # Optional, replace the module's defaults
    # title: CEOS-ARD
    # description: Product Family Specifications for CEOS Analysis Ready Data
    # color: "#3e5265"
    # The repository new workspaces fork and propose changes to; repo and branch keep the module's default if omitted.
    # Point it to a fork of ceos-org/ceos-ard when developing.
    upstream:
      owner: ceos-org
      repo: ceos-ard
      branch: main
    # Whether new workspaces can be created; existing workspaces keep working either way
    # offered: true
    # The module's own settings, all optional
    settings:
      # The types a new PFS can have
      pfs_types: [SAR, Optical]
      # The version of new PFS
      default_version: 1.0.0

  # OGC standards written with Metanorma; needs a firewall, see "Builds with network" in the README
  # - id: ogc
  #   module: ogc
  #   # Workspaces choose one of the owner's repositories
  #   upstream:
  #     owner: opengeospatial
  #   build_timeout: 180
  #   build_memory_max: 1536M
